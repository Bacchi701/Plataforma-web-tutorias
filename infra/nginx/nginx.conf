# ---------------------------------------------------------------
# Gateway del sistema. Solo enruta: no valida tokens ni tiene logica de
# negocio (AD-03). Es el unico componente que publica un puerto al equipo.
# ---------------------------------------------------------------

# Limite de intentos contra el inicio de sesion (Pilar 2, seccion 11).
# La zona se define ahora; el endpoint /login llega con HU-05.
limit_req_zone $binary_remote_addr zone=zona_login:10m rate=5r/m;

upstream identity { server identity:8000; }
upstream catalog  { server catalog:8000;  }
upstream tutoring { server tutoring:8000; }
upstream payments { server payments:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Cabeceras que se heredan en todas las rutas de abajo.
    # X-Request-Id es el identificador que se propaga a los servicios para
    # poder seguir un fallo que atraviesa tres de ellos (trazabilidad).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_read_timeout 30s;

    add_header X-Request-Id $request_id always;

    # Estado del propio gateway.
    location = /estado {
        default_type application/json;
        return 200 '{"servicio":"gateway","estado":"ok"}';
    }

    # Las rutas /internal no se enrutan: solo existen dentro de la red de
    # contenedores (Pilar 2, seccion 5.4). Desde fuera, no existen.
    # Va antes que las demas porque una expresion regular gana a un prefijo.
    location ~ ^/api/[a-z]+/v1/internal(/|$) {
        return 404;
    }

    location /api/identity/v1/login {
        limit_req zone=zona_login burst=5 nodelay;
        proxy_pass http://identity;
    }

    location /api/identity/ { proxy_pass http://identity; }
    location /api/catalog/  { proxy_pass http://catalog;  }
    location /api/tutoring/ { proxy_pass http://tutoring; }
    location /api/payments/ { proxy_pass http://payments; }

    # Pagina de estado del sistema. El frontend real llega con HU-06.
    # No se configura CORS: el frontend y la API salen por este mismo
    # origen, asi que no hay peticion entre origenes que permitir (AD-13).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
