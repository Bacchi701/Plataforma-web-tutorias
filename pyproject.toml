[tool.black]
line-length = 88
target-version = ["py312"]
# Igual que ruff: las migraciones las genera Django y no se reformatean.
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
# E y F: errores y avisos basicos. I: orden de las importaciones.
# UP: sintaxis que ya quedo antigua. B: errores logicos frecuentes.
select = ["E", "F", "I", "UP", "B"]
