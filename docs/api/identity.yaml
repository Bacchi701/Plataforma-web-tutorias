openapi: 3.0.3

info:
  title: Identidad · Plataforma de Tutorías entre Estudiantes
  version: 1.1.0
  description: |
    Contrato de la API pública de Identidad (HU-03; Pilar 2, sección 4.1).

    - Describe lo que hacen los PR #5 (HU-04) y #11 (HU-05) al 21-10-2026;
      desde la versión 1.1.0, el `PATCH /yo` del perfil (HU-10), y desde la
      próxima, las rutas `/admin/usuarios` del administrador (HU-31).
    - Todas las rutas pasan por el gateway y llevan el prefijo y la versión del
      servicio: `/api/identity/v1/`.
    - Las rutas `/internal` no son parte de este contrato: el gateway no las
      enruta y desde fuera responden 404.
    - Queda congelado al aprobarse el PR de HU-03. Un cambio durante el sprint
      se acuerda entre los tres antes de implementarse (acuerdo A4) y se anota
      en «Cambios», al final de esta descripción.

    **Formato de error (Pilar 2, sección 11).** Toda respuesta de error de los
    endpoints de Cuenta, Sesión, Perfil y Administración trae `codigo`,
    `mensaje` y `detalles` (ver el esquema `Error`). No lo traen el 503 de
    `/estado`, que responde con su propio esquema, lo que el gateway corta
    antes de llegar a Identidad (el límite de intentos de `/login` y las rutas
    `/internal`), ni la página 404 de Django cuando `usuario_id` no es un uuid
    en minúsculas (ver `components/parameters/UsuarioId`).

    **Sesión (Pilar 2, sección 5; AD-06).**
    - El token de acceso es un JWT firmado con RS256 que dura 30 minutos. Lleva
      `sub` (id del usuario), `es_admin`, `iat`, `exp` e `iss` = `identity`.
      No lleva el correo (RNF-07).
    - La renovación es un texto aleatorio que viaja en la cookie
      `refresh_token`: httpOnly, SameSite=Strict, Path=/api/identity/v1/ y
      7 días. Con `COOKIE_REFRESH_SEGURA=1`, el valor por defecto, lleva además
      Secure. El JavaScript de las páginas no la puede leer.
    - En la base se guarda solo el sha256 de la renovación y del enlace de
      verificación.

    **Administración (HU-31).**
    - Las rutas `/admin/usuarios` son solo para un administrador: quien trae
      un token de acceso con la marca `es_admin` en `true` (AD-09), la misma
      que piden las rutas `/admin` de Tutorías. La marca se toma de la cuenta
      (`usuario.es_admin`) al emitir el token, así que un cambio de la marca
      rige con el siguiente token de acceso: al iniciar sesión o al renovar la
      sesión. Sin un token válido responden 401, como `/yo`; con un token sin
      la marca, 403 `no_es_administrador`.
    - Desactivar una cuenta revoca en el mismo paso todas sus renovaciones
      abiertas: no puede renovar la sesión ni volver a iniciarla.
    - El token de acceso de una cuenta desactivada deja de servir de inmediato
      en Identidad, que busca la cuenta activa en cada petición, pero sirve
      hasta que vence (como mucho 30 minutos) en los otros servicios, que solo
      verifican la firma (Pilar 2, sección 5.3).

    **Cambios**
    - 1.0.0 (21-10-2026): primera versión.
    - 1.1.0 (22-10-2026): agrega `PATCH /yo` para completar y editar
      el perfil (HU-10), con el esquema `Perfil`. `GET /yo` muestra también un
      perfil completo, y su respuesta 401 pasa sin cambios a
      `components/responses/SinTokenValido`, que usan los dos métodos.
    - Próxima versión (HU-31): agrega la administración de usuarios, con la
      etiqueta Administración: `GET /admin/usuarios`, que lista y busca las
      cuentas por páginas, y `PATCH /admin/usuarios/{usuario_id}`, que activa
      o desactiva una. Suma el parámetro `UsuarioId`, los esquemas
      `UsuarioAdministrado`, `ListaDeUsuarios`, `CambioDeEstado` y
      `EstadoCambiado`, las respuestas `NoEsAdministrador` y
      `UsuarioNoEncontrado`, y sus códigos de error (ver el esquema `Error`).
      `GET /yo` aclara que las rutas `/admin` también entregan el correo, solo
      a un administrador.
    - Próxima versión (HU-11): `GET` y `PATCH /yo` y las dos rutas `/admin`
      suman la respuesta 503 `claves_no_configuradas`
      (`components/responses/ClavesNoConfiguradas`), que ahora cubre las dos
      claves: la privada, en `/login` y `/refresh`, y la pública, en las
      rutas con token, cuando falta el archivo o no es una clave. En
      `SinTokenValido`, `token_invalido` también cubre una cabecera con
      caracteres que no son texto y un `sub` que no es un identificador. En
      `POST /verificar-correo`, un cuerpo que no es un objeto JSON responde
      400 `invalid`, como si faltara el token, y un token que no se puede
      leer, 400 `token_invalido`. En `POST /login`, el límite de intentos del
      gateway responde 429 y ya no 503: el 503 queda solo para
      `claves_no_configuradas`.
    - Próxima versión (SCRUM-79): `PATCH /yo` acepta el nivel de 1 a 8, y ya
      no de 1 a 12, porque las mallas de Duoc UC llegan al semestre 8.
      Cambian el esquema `Perfil` (`maximum: 8`) y el 400
      `nivel_fuera_de_rango`, que dice «El nivel debe ser un número entero
      de 1 a 8.». La base sigue admitiendo de 1 a 12 (`ck_usuario_nivel`):
      por eso `Yo` y `UsuarioAdministrado` siguen con `maximum: 12`, y una
      cuenta que guardó de 9 a 12 antes de este cambio lo sigue devolviendo.

servers:
  - url: http://localhost:8080
    description: Gateway del sistema levantado con Docker Compose. La API se llama siempre a través de él.

tags:
  - name: Cuenta
    description: Registro y verificación del correo (HU-04).
  - name: Sesión
    description: Inicio, renovación y cierre de sesión (HU-05).
  - name: Perfil
    description: Nombre, carrera, nivel y sede del usuario con sesión (HU-10).
  - name: Administración
    description: Usuarios del panel de administración (HU-31). Solo con la marca de administrador.
  - name: Estado
    description: Estado del servicio y de su base (HU-01).

paths:

  /api/identity/v1/registro:
    post:
      tags: [Cuenta]
      operationId: registrar
      summary: Crear una cuenta con el correo institucional
      description: |
        Crea la cuenta sin verificar y envía por correo un enlace de
        verificación que vence en 24 horas y sirve una sola vez (HU-04,
        criterios 1 y 2).

        - Pide solo nombre, apellido, correo institucional y contraseña
          (HU-03, criterio 2): sin RUT, sin tipo de cuenta y sin carrera,
          nivel ni sede, que se completan en el perfil (HU-10). Si llegan otros
          campos, se ignoran.
        - El correo se guarda en minúsculas y no se puede repetir, aunque
          cambien las mayúsculas.
        - Si la bandeja de correo no responde, la cuenta igual queda creada:
          `correo_enviado` vuelve en `false` y el aviso queda como FALLIDO en
          `aviso_correo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
            example:
              nombre: Ana
              apellido: Demo
              email: ana.demo@duocuc.cl
              password: clave-segura-1
      responses:
        '201':
          description: Cuenta creada sin verificar. El enlace llega a la bandeja (Mailpit, en desarrollo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroCreado'
              example:
                id: 6f1c2a4e-8b1d-4c3e-9a7f-2d5b8e0c1a34
                email: ana.demo@duocuc.cl
                correo_enviado: true
        '400':
          description: |
            Datos inválidos: `codigo` es `invalid` y `detalles` dice qué campo
            corregir. También responde así si falta un campo, si el correo no
            tiene formato de correo o si un campo viene vacío; esos mensajes los
            pone el validador del framework (Django REST Framework).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                correo_no_institucional:
                  summary: El correo no termina en @duocuc.cl
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      email:
                        - Usa tu correo institucional, que termina en @duocuc.cl.
                correo_repetido:
                  summary: Ya hay una cuenta con ese correo
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      email:
                        - Ya existe una cuenta con este correo.
                clave_corta:
                  summary: La contraseña tiene menos de 8 caracteres
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      password:
                        - La contraseña debe tener al menos 8 caracteres.

  /api/identity/v1/verificar-correo:
    post:
      tags: [Cuenta]
      operationId: verificarCorreo
      summary: Verificar el correo con el token del enlace
      description: |
        Marca la cuenta como verificada (HU-04, criterio 3). El token es el
        parámetro `token` del enlace que llega por correo
        (`{URL_FRONTEND}/verificar.html?token=...`); la página de verificación
        lo lee y llama a este endpoint. Sirve una sola vez y vence a las
        24 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarCorreo'
            example:
              token: q3Yz8m1V0bKkO5x2rW9tC4nH7aL6dE1fS0gJ3uP2iQw
      responses:
        '200':
          description: Correo verificado. Ya se puede iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Tu correo quedó verificado. Ya puedes iniciar sesión.
        '400':
          description: |
            El token falta (`invalid`), no existe (`token_invalido`), ya se usó
            (`token_usado`) o venció (`token_vencido`). Un cuerpo que no es un
            objeto JSON (una lista, un texto, un número o `null`) responde
            `invalid`, como si faltara el token, y un token que no se puede
            leer, `token_invalido`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                falta_el_token:
                  summary: La petición no trae el token
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      token:
                        - Falta el token del enlace.
                token_invalido:
                  summary: El token no existe o no se puede leer
                  value:
                    codigo: token_invalido
                    mensaje: El enlace no es válido.
                    detalles: null
                token_usado:
                  summary: El enlace ya se usó
                  value:
                    codigo: token_usado
                    mensaje: Este enlace ya se usó. Si tu cuenta está verificada, inicia sesión.
                    detalles: null
                token_vencido:
                  summary: Pasaron más de 24 horas
                  value:
                    codigo: token_vencido
                    mensaje: El enlace venció. Pide uno nuevo.
                    detalles: null

  /api/identity/v1/login:
    post:
      tags: [Sesión]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Entrega el token de acceso en el cuerpo y la renovación en la cookie
        `refresh_token` (HU-05, criterios 1, 2 y 5; HU-04, criterio 4).

        - El correo se compara en minúsculas y sin espacios al inicio ni al
          final.
        - Se revisa en este orden: credenciales (401), cuenta activa (403) y
          correo verificado (403). Si la cuenta no existe, el mensaje es el
          mismo que con una contraseña equivocada.
        - Límite del gateway: 5 intentos por minuto por IP, con una ráfaga de
          5 más. Sobre eso, Nginx responde 429 con su propia página, sin el
          formato de error de la API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: ana.demo@duocuc.cl
              password: clave-segura-1
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                token_acceso: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ZjFjMmE0ZS04YjFkLTRjM2UtOWE3Zi0yZDViOGUwYzFhMzQiLCJlc19hZG1pbiI6ZmFsc2UsImlhdCI6MTc5MjU5NDgwMCwiZXhwIjoxNzkyNTk2NjAwLCJpc3MiOiJpZGVudGl0eSJ9.firma
                tipo_token: Bearer
                expira_en_segundos: 1800
        '400':
          description: |
            Falta el correo o la contraseña, viene vacío o pasa el largo
            máximo (`invalid`, con el detalle por campo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Correo o contraseña incorrectos, o la cuenta no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: credenciales_invalidas
                mensaje: Correo o contraseña incorrectos.
                detalles: null
        '403':
          description: La cuenta está desactivada o el correo no está verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cuenta_desactivada:
                  summary: Un administrador desactivó la cuenta
                  value:
                    codigo: cuenta_desactivada
                    mensaje: Tu cuenta está desactivada.
                    detalles: null
                correo_no_verificado:
                  summary: Falta abrir el enlace del correo
                  value:
                    codigo: correo_no_verificado
                    mensaje: 'Verifica tu correo antes de iniciar sesión: revisa tu bandeja.'
                    detalles: null
        '429':
          description: |
            La IP pasó el límite de intentos del gateway. Responde Nginx, con
            su página HTML y sin el formato de error de la API.
          content:
            text/html:
              schema:
                type: string
              example: '<html><head><title>429 Too Many Requests</title></head>...</html>'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /api/identity/v1/refresh:
    post:
      tags: [Sesión]
      operationId: renovarSesion
      summary: Renovar el token de acceso con la cookie
      description: |
        Entrega un token de acceso nuevo sin volver a escribir la contraseña
        (HU-05, criterio 3). No lleva cuerpo: usa la cookie `refresh_token`,
        que el navegador envía solo.

        - La renovación usada queda revocada y se entrega otra en la cookie
          (rotación): una cookie copiada deja de servir apenas su dueño
          renueva.
        - Si la sesión no es válida, la respuesta no borra la cookie: si dos
          pestañas renuevan a la vez, la que pierde no borra la renovación
          nueva de la otra.
      security:
        - cookieRenovacion: []
      responses:
        '200':
          description: Sesión renovada. La cookie trae una renovación nueva.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                token_acceso: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ZjFjMmE0ZS04YjFkLTRjM2UtOWE3Zi0yZDViOGUwYzFhMzQiLCJlc19hZG1pbiI6ZmFsc2UsImlhdCI6MTc5MjU5NjMwMCwiZXhwIjoxNzkyNTk4MTAwLCJpc3MiOiJpZGVudGl0eSJ9.firma
                tipo_token: Bearer
                expira_en_segundos: 1800
        '401':
          description: |
            Falta la cookie, o la renovación no existe, está revocada o
            vencida, o la cuenta está desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: sesion_invalida
                mensaje: La sesión no es válida o venció.
                detalles: null
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /api/identity/v1/logout:
    post:
      tags: [Sesión]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: |
        Revoca la renovación de esta sesión y borra la cookie (HU-05,
        criterio 4). No lleva cuerpo ni token de acceso. Responde 204 aunque
        no venga la cookie o la renovación ya no sirva.

        El token de acceso no se puede revocar: sigue sirviendo hasta que vence
        (como mucho 30 minutos). Por eso la página lo descarta al cerrar
        sesión.
      security:
        - cookieRenovacion: []
        - {}
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              description: Borra la cookie de renovación.
              schema:
                type: string
              example: 'refresh_token=""; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; Path=/api/identity/v1/; SameSite=Strict'

  /api/identity/v1/yo:
    get:
      tags: [Sesión]
      operationId: obtenerYo
      summary: Datos del usuario con sesión
      description: |
        Devuelve los datos de la cuenta dueña del token. Aparte de `/registro`,
        que devuelve el correo recién registrado, y de las rutas `/admin`, que
        lo entregan solo a un administrador (HU-31), es el único endpoint que
        entrega el correo (con `GET` y con `PATCH`); el token no lo lleva
        (RNF-07). `carrera_id`, `nivel` y `sede_id` vienen en `null` hasta que
        el usuario completa su perfil con `PATCH /yo` (HU-10). Carrera y sede
        son identificadores de Catálogo: el nombre se toma de
        `GET /api/catalog/v1/carreras` y `GET /api/catalog/v1/sedes`.
      security:
        - tokenAcceso: []
      responses:
        '200':
          description: Datos de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
              examples:
                perfil_completo:
                  summary: Con carrera, nivel y sede (HU-10)
                  value:
                    id: 6f1c2a4e-8b1d-4c3e-9a7f-2d5b8e0c1a34
                    email: ana.demo@duocuc.cl
                    nombre: Ana
                    apellido: Demo
                    carrera_id: 20000000-0000-4000-8000-000000000001
                    nivel: 4
                    sede_id: 30000000-0000-4000-8000-000000000011
                    es_admin: false
                recien_registrado:
                  summary: Recién registrado, con el perfil incompleto
                  value:
                    id: 6f1c2a4e-8b1d-4c3e-9a7f-2d5b8e0c1a34
                    email: ana.demo@duocuc.cl
                    nombre: Ana
                    apellido: Demo
                    carrera_id: null
                    nivel: null
                    sede_id: null
                    es_admin: false
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'
    patch:
      tags: [Perfil]
      operationId: editarPerfil
      summary: Completar o editar el perfil
      description: |
        Guarda el nombre, el apellido, la carrera, la sede y el nivel de la
        cuenta dueña del token (HU-10, criterios 2, 3 y 5) y responde lo mismo
        que `GET /yo`, con los datos ya guardados.

        - Acepta cambios parciales: basta con mandar lo que cambia. Pero el
          perfil tiene que quedar completo: si después del cambio faltaría la
          carrera, la sede o el nivel, responde 400 y dice cuáles faltan. Por
          eso, mientras el perfil está incompleto, se mandan los tres juntos.
        - Carrera, sede y nivel no se pueden vaciar: con `null` o `""`
          responde 400. Nombre y apellido, si vienen, no pueden quedar vacíos.
        - Acepta solo los cinco campos del esquema `Perfil`. Cualquier otro,
          como `email`, `es_admin` o `activo`, se rechaza con 400 (criterio 5).
        - Si responde 400, no guarda nada de la petición, aunque el resto de
          los campos venga bien.
        - Carrera y sede se guardan como identificadores, sin preguntarle a
          Catálogo si existen (AD-15). La página de perfil ofrece solo las de
          `GET /api/catalog/v1/carreras` y `GET /api/catalog/v1/sedes`.
        - Si el usuario ya declaró asignaturas y cambia su carrera o su nivel,
          el cambio se guarda igual. Las asignaturas que dejan de cumplir RN-01
          se desactivan en la siguiente sincronización de Tutorías (HU-19,
          todavía no implementada).
      security:
        - tokenAcceso: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
            examples:
              completar_perfil:
                summary: Primera vez, con el perfil incompleto
                value:
                  nombre: Ana
                  apellido: Demo
                  carrera_id: 20000000-0000-4000-8000-000000000001
                  sede_id: 30000000-0000-4000-8000-000000000011
                  nivel: 4
              cambiar_sede_y_nivel:
                summary: Con el perfil completo, solo lo que cambia
                value:
                  sede_id: 30000000-0000-4000-8000-000000000001
                  nivel: 5
      responses:
        '200':
          description: Perfil guardado. Trae los datos de la cuenta, igual que `GET /yo`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
              example:
                id: 6f1c2a4e-8b1d-4c3e-9a7f-2d5b8e0c1a34
                email: ana.demo@duocuc.cl
                nombre: Ana
                apellido: Demo
                carrera_id: 20000000-0000-4000-8000-000000000001
                nivel: 4
                sede_id: 30000000-0000-4000-8000-000000000011
                es_admin: false
        '400':
          description: |
            Datos inválidos: `codigo` es `invalid` y `detalles` dice qué campo
            corregir. Pasa si el nivel no es un entero de 1 a 8, si la carrera
            o la sede no son un uuid, si un campo viene vacío o en `null`, si
            el perfil quedaría sin carrera, sede o nivel, o si viene un campo
            que no es del perfil. Con el JSON mal formado responde
            `parse_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nivel_fuera_de_rango:
                  summary: El nivel es 0, 9 o no es un número entero
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      nivel:
                        - El nivel debe ser un número entero de 1 a 8.
                carrera_no_es_uuid:
                  summary: La carrera no es un uuid
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      carrera_id:
                        - 'La carrera no es válida: elígela de la lista.'
                campo_vacio:
                  summary: La carrera viene en null
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      carrera_id:
                        - Elige tu carrera.
                perfil_incompleto:
                  summary: Perfil sin carrera ni sede, y la petición trae solo el nivel
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      carrera_id:
                        - Elige tu carrera.
                      sede_id:
                        - Elige tu sede.
                campo_que_no_es_del_perfil:
                  summary: La petición trae es_admin
                  value:
                    codigo: invalid
                    mensaje: La petición tiene datos inválidos.
                    detalles:
                      es_admin:
                        - Este campo no se puede cambiar desde el perfil.
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /api/identity/v1/admin/usuarios:
    get:
      tags: [Administración]
      operationId: listarUsuarios
      summary: Listar y buscar las cuentas
      description: |
        Las cuentas de la plataforma, de la más nueva a la más antigua
        (`creado_en` descendente y después `id`), por páginas (HU-31,
        criterio 1). Solo para un administrador.

        - `buscar` deja las cuentas en que cada palabra aparece en el nombre o
          en el apellido, sin distinguir mayúsculas. Las tildes sí cuentan:
          «matias» no encuentra a «Matías».
        - `activo` deja solo las cuentas activas (`true`) o solo las
          desactivadas (`false`). Sin el parámetro trae las dos.
        - Las cuentas vienen en `resultados`, con los mismos nombres de la
          búsqueda paginada de Catálogo: `total`, `pagina`, `total_paginas`,
          `limite` y `resultados`. Una página más allá de la última responde
          200 con `resultados` vacío.
        - Los parámetros se revisan en este orden: `buscar`, `activo`,
          `pagina` y `limite`. Si `activo`, `pagina` o `limite` vienen vacíos
          (por ejemplo `?activo=`), responden 400: para no usarlos, no se
          mandan. `buscar` vacío o con solo espacios trae todas las cuentas.
        - Cada cuenta trae su correo: es lo que distingue dos cuentas con el
          mismo nombre. Solo lo ve un administrador y no sale de Identidad
          (RNF-07).
      security:
        - tokenAcceso: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: |
            Nombre, apellido o los dos. Se recortan los espacios y se parte en
            palabras; cada palabra tiene que aparecer en el nombre o en el
            apellido. Hasta 80 caracteres y sin el carácter nulo (`%00`); si
            no, 400 `busqueda_invalida`.
          schema:
            type: string
            maxLength: 80
          example: rojas
        - name: activo
          in: query
          required: false
          description: '`true` o `false`, en minúsculas. Otro valor responde 400 `activo_invalido`.'
          schema:
            type: string
            enum: ['true', 'false']
          example: 'false'
        - name: pagina
          in: query
          required: false
          description: La página, un número entero desde 1. Otro valor responde 400 `pagina_invalida`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limite
          in: query
          required: false
          description: Cuentas por página, un número entero de 1 a 100. Otro valor responde 400 `limite_invalido`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: |
            La página pedida. `total` cuenta todas las cuentas que cumplen el
            filtro, no solo las de esta página. Los ejemplos son de los datos
            de ejemplo (`data/seeds/demo`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeUsuarios'
              examples:
                buscar_rojas:
                  summary: '?buscar=rojas'
                  value:
                    total: 1
                    pagina: 1
                    total_paginas: 1
                    limite: 50
                    resultados:
                      - id: 10000000-0000-4000-8000-000000000004
                        email: camila.demo@duocuc.cl
                        nombre: Camila
                        apellido: Rojas
                        carrera_id: 20000000-0000-4000-8000-000000000001
                        sede_id: 30000000-0000-4000-8000-000000000011
                        nivel: 2
                        email_verificado: true
                        activo: true
                        es_admin: false
                        creado_en: '2026-09-12T16:40:00Z'
                primera_pagina:
                  summary: '?limite=2: las dos cuentas más nuevas de las ocho'
                  value:
                    total: 8
                    pagina: 1
                    total_paginas: 4
                    limite: 2
                    resultados:
                      - id: 10000000-0000-4000-8000-000000000007
                        email: tomas.demo@duocuc.cl
                        nombre: Tomás
                        apellido: Vidal
                        carrera_id: null
                        sede_id: null
                        nivel: null
                        email_verificado: false
                        activo: true
                        es_admin: false
                        creado_en: '2026-09-29T23:00:00Z'
                      - id: 10000000-0000-4000-8000-000000000006
                        email: josefa.demo@duocuc.cl
                        nombre: Josefa
                        apellido: Morales
                        carrera_id: 20000000-0000-4000-8000-000000000003
                        sede_id: 30000000-0000-4000-8000-000000000003
                        nivel: 5
                        email_verificado: true
                        activo: false
                        es_admin: false
                        creado_en: '2026-09-14T11:20:00Z'
                sin_coincidencias:
                  summary: '?buscar=zzz: ninguna cuenta'
                  value:
                    total: 0
                    pagina: 1
                    total_paginas: 1
                    limite: 50
                    resultados: []
        '400':
          description: |
            Un parámetro no es válido. Los códigos posibles, en el orden en
            que se revisan, son `busqueda_invalida`, `activo_invalido`,
            `pagina_invalida` y `limite_invalido`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busqueda_invalida:
                  summary: '`buscar` con más de 80 caracteres o con el carácter nulo'
                  value:
                    codigo: busqueda_invalida
                    mensaje: Escribe hasta 80 caracteres para buscar a un usuario.
                    detalles: null
                activo_invalido:
                  summary: '`activo` no es true ni false, por ejemplo ?activo=si'
                  value:
                    codigo: activo_invalido
                    mensaje: El filtro activo tiene que ser true o false.
                    detalles: null
                pagina_invalida:
                  summary: '`pagina` no es un entero desde 1, por ejemplo ?pagina=0'
                  value:
                    codigo: pagina_invalida
                    mensaje: La página tiene que ser un número entero desde 1.
                    detalles: null
                limite_invalido:
                  summary: '`limite` no es un entero de 1 a 100, por ejemplo ?limite=101'
                  value:
                    codigo: limite_invalido
                    mensaje: El límite tiene que ser un número entero de 1 a 100.
                    detalles: null
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/NoEsAdministrador'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /api/identity/v1/admin/usuarios/{usuario_id}:
    patch:
      tags: [Administración]
      operationId: cambiarEstadoDeUsuario
      summary: Activar o desactivar una cuenta
      description: |
        Desactiva una cuenta o la vuelve a activar (HU-31, criterio 2; Pilar 2,
        sección 4.1). Solo para un administrador. El cuerpo trae solo
        `activo`: desde el panel no se cambia nada más de una cuenta.

        Se revisa en este orden:
        - que el cuerpo sea exactamente `{"activo": true}` o
          `{"activo": false}` (400 `activo_invalido`);
        - después, en una transacción con la cuenta bloqueada, que la cuenta
          exista (404 `usuario_no_encontrado`) y que el administrador no esté
          desactivando su propia cuenta (409 `cuenta_propia`), para que el
          panel no se quede sin administrador por un clic.

        Lo que hace:
        - Con `false`, la cuenta queda desactivada y, en la misma transacción,
          todas sus renovaciones sin revocar quedan revocadas (RN-08, CA7):
          `sesiones_revocadas` dice cuántas. Las que ya estaban revocadas
          conservan su fecha. Desde ahí, `/login` responde 403
          `cuenta_desactivada` y `/refresh` con una de sus cookies, 401
          `sesion_invalida`.
        - Con `true`, la cuenta vuelve a estar activa, con
          `sesiones_revocadas` en 0. No se crea ninguna sesión: la persona
          vuelve a iniciar sesión.
        - Si la cuenta ya estaba en ese estado, no cambia nada y responde
          igual, con `sesiones_revocadas` en 0.
        - El token de acceso que la cuenta ya tenía deja de servir de
          inmediato en Identidad (401 `cuenta_inactiva`), pero sirve hasta
          que vence en Tutorías y Pagos, que solo verifican la firma (Pilar 2,
          sección 5.3). La búsqueda de tutores deja fuera la cuenta
          desactivada tras la siguiente sincronización de las copias de
          Tutorías (HU-19).
        - No envía ningún correo.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioDeEstado'
            examples:
              desactivar:
                summary: Desactivar la cuenta
                value:
                  activo: false
              activar:
                summary: Volver a activarla
                value:
                  activo: true
      responses:
        '200':
          description: La cuenta, ya guardada, y cuántas renovaciones revocó esta petición.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCambiado'
              examples:
                desactivada:
                  summary: Camila desactivada, con una sesión abierta
                  value:
                    id: 10000000-0000-4000-8000-000000000004
                    email: camila.demo@duocuc.cl
                    nombre: Camila
                    apellido: Rojas
                    carrera_id: 20000000-0000-4000-8000-000000000001
                    sede_id: 30000000-0000-4000-8000-000000000011
                    nivel: 2
                    email_verificado: true
                    activo: false
                    es_admin: false
                    creado_en: '2026-09-12T16:40:00Z'
                    sesiones_revocadas: 1
                activada:
                  summary: Camila activada otra vez
                  value:
                    id: 10000000-0000-4000-8000-000000000004
                    email: camila.demo@duocuc.cl
                    nombre: Camila
                    apellido: Rojas
                    carrera_id: 20000000-0000-4000-8000-000000000001
                    sede_id: 30000000-0000-4000-8000-000000000011
                    nivel: 2
                    email_verificado: true
                    activo: true
                    es_admin: false
                    creado_en: '2026-09-12T16:40:00Z'
                    sesiones_revocadas: 0
        '400':
          description: |
            El cuerpo no es exactamente `{"activo": true}` o
            `{"activo": false}`: falta `activo`, viene como texto (`"false"`),
            como número (`0`) o en `null`, trae otro campo (como `es_admin` o
            `email`) o no es un objeto. No se cambia nada. Con el JSON mal
            formado responde `parse_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                activo_invalido:
                  summary: 'El cuerpo trae {"activo": false, "es_admin": true}'
                  value:
                    codigo: activo_invalido
                    mensaje: Envía solo el campo activo, con true o false.
                    detalles: null
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/NoEsAdministrador'
        '404':
          $ref: '#/components/responses/UsuarioNoEncontrado'
        '409':
          description: El administrador intenta desactivar su propia cuenta. No se cambia nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cuenta_propia:
                  summary: admin.demo se desactiva a sí mismo
                  value:
                    codigo: cuenta_propia
                    mensaje: No puedes desactivar tu propia cuenta.
                    detalles: null
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /api/identity/v1/estado:
    get:
      tags: [Estado]
      operationId: estadoIdentidad
      summary: Estado del servicio y de su base
      description: |
        Lo consultan la integración continua (trabajo «levantar») y la
        verificación de salud del contenedor (HU-01).
      responses:
        '200':
          description: El servicio y su base responden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: identity
                estado: ok
                base_de_datos: ok
                version: 0.1.0
        '503':
          description: El servicio arrancó, pero no puede leer su base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: identity
                estado: degradado
                base_de_datos: sin conexion
                version: 0.1.0

components:

  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cabecera `Authorization: Bearer <token_acceso>`. JWT RS256 de 30 minutos.'
    cookieRenovacion:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Cookie httpOnly que entregan /login y /refresh. El navegador la envía sola a /api/identity/v1/.

  headers:
    CookieRenovacion:
      description: |
        Renovación nueva: `refresh_token=<texto aleatorio>`, con expires,
        HttpOnly, Max-Age=604800 (7 días), Path=/api/identity/v1/,
        SameSite=Strict y Secure cuando `COOKIE_REFRESH_SEGURA=1`.
      schema:
        type: string
      example: 'refresh_token=Vb3kZ0pQx7...; expires=Wed, 28 Oct 2026 03:00:00 GMT; HttpOnly; Max-Age=604800; Path=/api/identity/v1/; SameSite=Strict; Secure'

  parameters:
    UsuarioId:
      name: usuario_id
      in: path
      required: true
      description: |
        Identificador de la cuenta, el `id` que entrega
        `GET /admin/usuarios`: un uuid en minúsculas y con guiones. Con otra
        forma (por ejemplo, en mayúsculas o mal escrito) la ruta no existe y
        responde Django con su página 404, en HTML y sin el formato de error
        de la API (ver `components/responses/UsuarioNoEncontrado`).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 10000000-0000-4000-8000-000000000004

  responses:
    ClavesNoConfiguradas:
      description: |
        Identidad no encuentra o no puede leer una de sus claves: la privada,
        para firmar el token en `/login` y `/refresh`, o la pública, para
        verificarlo en las rutas con token. Pasa en un clon nuevo sin las
        claves, o si el archivo no es una clave (por ejemplo, si está vacío).
        El mensaje dice qué archivo revisar. En las rutas con token, una
        petición sin token no lee la clave: responde 401 `not_authenticated`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            falta_la_clave_privada:
              summary: Un clon nuevo, sin las claves (en /login y /refresh)
              value:
                codigo: claves_no_configuradas
                mensaje: 'No existe /app/keys/jwt_private.pem. Genera las claves con: python manage.py generar_claves_jwt (ver el RUNBOOK, nivel 3).'
                detalles: null
            falta_la_clave_publica:
              summary: Sin la clave pública, en una ruta con token
              value:
                codigo: claves_no_configuradas
                mensaje: 'No existe /app/keys/jwt_public.pem. Genera las claves con: python manage.py generar_claves_jwt (ver el RUNBOOK, nivel 3).'
                detalles: null
            no_es_una_clave:
              summary: El archivo de la clave está vacío o tiene otro texto
              value:
                codigo: claves_no_configuradas
                mensaje: 'El archivo /app/keys/jwt_public.pem no es una clave PEM válida. Revísalo o genera las claves de nuevo con: python manage.py generar_claves_jwt --forzar (ver el README).'
                detalles: null
    SinTokenValido:
      description: |
        Sin token válido. Los códigos posibles son:
        - `not_authenticated`: no viene la cabecera
          `Authorization: Bearer …` (el mensaje es el estándar de Django
          REST Framework);
        - `authentication_failed`: la cabecera está mal formada;
        - `token_invalido`: el token está mal formado, su firma, su algoritmo
          o su emisor no calzan, la cabecera trae caracteres que no son texto
          o el `sub` del token no es un identificador (un uuid);
        - `token_vencido`: pasaron los 30 minutos;
        - `cuenta_inactiva`: la cuenta ya no existe o está desactivada.
      headers:
        WWW-Authenticate:
          description: Siempre `Bearer realm="identity"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalido:
              summary: El token no es válido
              value:
                codigo: token_invalido
                mensaje: El token de acceso no es válido.
                detalles: null
            token_vencido:
              summary: El token venció
              value:
                codigo: token_vencido
                mensaje: El token de acceso venció.
                detalles: null
    NoEsAdministrador:
      description: |
        El token no trae `es_admin` en `true`: la cuenta no es administradora
        (AD-09). Es el mismo código y el mismo mensaje de las rutas `/admin`
        de Tutorías. La marca sale del token, así que un cambio de
        `usuario.es_admin` rige con el siguiente token de acceso, al iniciar
        sesión o al renovar la sesión.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            no_es_administrador:
              summary: valentina.demo, que no es administradora
              value:
                codigo: no_es_administrador
                mensaje: Esta sección es solo para administradores.
                detalles: null
    UsuarioNoEncontrado:
      description: |
        No existe una cuenta con ese identificador.

        Si `usuario_id` no es un uuid en minúsculas, la ruta no existe y
        responde Django con su página 404, en HTML y sin el formato de error
        de la API, como en Tutorías con `bloque_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: usuario_no_encontrado
            mensaje: El usuario no existe.
            detalles: null
        text/html:
          schema:
            type: string
          examples:
            ruta_inexistente:
              summary: PATCH /admin/usuarios/abc con DJANGO_DEBUG=1 (recortada)
              value: '<!DOCTYPE html><html lang="en"><head>...<title>Page not found at /api/identity/v1/admin/usuarios/abc</title>...</html>'

  schemas:

    Registro:
      type: object
      required: [nombre, apellido, email, password]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios al inicio y al final; no puede quedar vacío.
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios al inicio y al final; no puede quedar vacío.
        email:
          type: string
          format: email
          maxLength: 150
          pattern: '@[dD][uU][oO][cC][uU][cC]\.[cC][lL]$'
          description: Correo institucional. Debe terminar en @duocuc.cl, sin importar mayúsculas. Se guarda en minúsculas.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: No se recortan los espacios. Se guarda solo su hash (RNF-01).

    RegistroCreado:
      type: object
      required: [id, email, correo_enviado]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: El correo tal como quedó guardado, en minúsculas.
        correo_enviado:
          type: boolean
          description: false si la bandeja no respondió. La cuenta queda creada igual.

    VerificarCorreo:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: Parámetro token del enlace del correo. Se recortan los espacios.

    Mensaje:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string

    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 150
          description: No puede venir vacío ni solo con espacios.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: No puede venir vacía. No se recortan los espacios.

    Sesion:
      type: object
      required: [token_acceso, tipo_token, expira_en_segundos]
      properties:
        token_acceso:
          type: string
          description: JWT RS256 con sub, es_admin, iat, exp e iss; sin el correo.
        tipo_token:
          type: string
          enum: [Bearer]
        expira_en_segundos:
          type: integer
          description: Duración del token de acceso. Hoy son 1800 segundos (30 minutos).

    Yo:
      type: object
      required: [id, email, nombre, apellido, carrera_id, nivel, sede_id, es_admin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        carrera_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la carrera en Catálogo (AD-15, sin FK entre bases). null hasta que se completa el perfil.
        nivel:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
          description: Semestre que cursa. null hasta que se completa el perfil. `PATCH /yo` acepta de 1 a 8; de 9 a 12 solo puede venir en una cuenta que lo guardó antes de SCRUM-79 (la base admite de 1 a 12).
        sede_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la sede en Catálogo. null hasta que se completa el perfil.
        es_admin:
          type: boolean

    Perfil:
      type: object
      additionalProperties: false
      description: |
        Lo que `PATCH /yo` deja cambiar (HU-10, criterio 5). Todos los campos
        son opcionales en la petición, pero el perfil tiene que quedar con
        carrera, sede y nivel. Cualquier otro campo se rechaza con 400.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios al inicio y al final; no puede quedar vacío.
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          description: Se recortan los espacios al inicio y al final; no puede quedar vacío.
        carrera_id:
          type: string
          format: uuid
          description: Una carrera de `GET /api/catalog/v1/carreras`. No puede venir vacía ni en null.
        sede_id:
          type: string
          format: uuid
          description: Una sede de `GET /api/catalog/v1/sedes`. No puede venir vacía ni en null.
        nivel:
          type: integer
          minimum: 1
          maximum: 8
          description: Semestre que cursa, de 1 a 8. No puede venir en null.

    UsuarioAdministrado:
      type: object
      description: |
        Una cuenta como la ve el panel de administración (HU-31), con las
        claves en este orden. Nunca trae el hash de la clave. El correo va
        porque distingue dos cuentas con el mismo nombre: solo lo ve un
        administrador y no sale de Identidad (RNF-07).
      required: [id, email, nombre, apellido, carrera_id, sede_id, nivel, email_verificado, activo, es_admin, creado_en]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        carrera_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la carrera en Catálogo, como en `GET /yo`. null si el perfil está incompleto.
        sede_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la sede en Catálogo. null si el perfil está incompleto.
        nivel:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
          description: Semestre que cursa. null si el perfil está incompleto. Como en `GET /yo`, de 9 a 12 solo puede venir en una cuenta que lo guardó antes de SCRUM-79.
        email_verificado:
          type: boolean
          description: false si la persona todavía no abre el enlace del correo de verificación.
        activo:
          type: boolean
          description: false si la cuenta está desactivada.
        es_admin:
          type: boolean
        creado_en:
          type: string
          format: date-time
          description: Cuándo se creó la cuenta, en UTC con `Z` y sin fracción de segundo, por ejemplo `2026-09-12T16:40:00Z`.

    ListaDeUsuarios:
      type: object
      description: Una página de cuentas, con los nombres de la búsqueda paginada de Catálogo.
      required: [total, pagina, total_paginas, limite, resultados]
      properties:
        total:
          type: integer
          minimum: 0
          description: Cuántas cuentas cumplen el filtro, sumando todas las páginas.
        pagina:
          type: integer
          minimum: 1
          description: La página pedida.
        total_paginas:
          type: integer
          minimum: 1
          description: Cuántas páginas hay. Al menos 1, aunque no haya cuentas.
        limite:
          type: integer
          minimum: 1
          maximum: 100
          description: Cuentas por página.
        resultados:
          type: array
          description: Las cuentas de esta página, de la más nueva a la más antigua. Vacía si la página está más allá de la última.
          items:
            $ref: '#/components/schemas/UsuarioAdministrado'

    CambioDeEstado:
      type: object
      additionalProperties: false
      required: [activo]
      description: |
        El cuerpo de `PATCH /admin/usuarios/{usuario_id}`: solo `activo`, un
        booleano de JSON. Con cualquier otro campo, o con `activo` como texto,
        número o null, responde 400 `activo_invalido`.
      properties:
        activo:
          type: boolean
          description: false desactiva la cuenta y revoca sus renovaciones; true la vuelve a activar.

    EstadoCambiado:
      description: La cuenta ya guardada, como en `UsuarioAdministrado`, más `sesiones_revocadas`.
      allOf:
        - $ref: '#/components/schemas/UsuarioAdministrado'
        - type: object
          required: [sesiones_revocadas]
          properties:
            sesiones_revocadas:
              type: integer
              minimum: 0
              description: Cuántas renovaciones revocó esta petición. 0 al activar, o si la cuenta ya estaba desactivada.

    Estado:
      type: object
      required: [servicio, estado, base_de_datos, version]
      properties:
        servicio:
          type: string
          example: identity
        estado:
          type: string
          enum: [ok, degradado]
        base_de_datos:
          type: string
          enum: [ok, sin conexion]
        version:
          type: string

    Error:
      type: object
      description: |
        Formato único de error de la API (Pilar 2, sección 11).

        - Errores de validación: `codigo` = `invalid`, `mensaje` = «La
          petición tiene datos inválidos.» y `detalles` = un objeto con una
          lista de mensajes por campo.
        - Errores con código propio: `detalles` = null. Son token_invalido,
          token_usado, token_vencido, credenciales_invalidas,
          cuenta_desactivada, correo_no_verificado, sesion_invalida,
          claves_no_configuradas, not_authenticated, authentication_failed y
          cuenta_inactiva. Las rutas de administración (HU-31) suman
          no_es_administrador, usuario_no_encontrado, busqueda_invalida,
          activo_invalido, pagina_invalida, limite_invalido y cuenta_propia.
        - Otros códigos los pone el framework: parse_error (JSON mal formado,
          400), method_not_allowed (405) y unsupported_media_type (415).
      required: [codigo, mensaje, detalles]
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        detalles:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
