        antigua (`creada_en`), hasta 100. Son el backend de las pantallas «Mis
        reservas y solicitudes recibidas» (HU-30) y de pago (HU-24).

        - `rol=estudiante`: las reservas que solicitó. `rol=tutor`: las de
          sus bloques, que le solicitaron otros.
        - `estado`, si viene, deja solo las reservas en ese estado.
        - Se revisa primero `rol` (400 `rol_invalido`) y después `estado`
