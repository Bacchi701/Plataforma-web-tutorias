  schemas:

    TutorEncontrado:
      type: object
      description: Un tutor de la búsqueda, con su tarifa y su descripción en la asignatura buscada.
      required: [usuario_id, nombre, apellido, carrera_id, sede_id, asignatura, tarifa, descripcion, reputacion]
      properties:
        usuario_id:
          type: string
          format: uuid
          description: Identificador del usuario en Identidad. Es el que pide `GET /tutores/{usuario_id}`.
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        carrera_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la carrera en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        sede_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la sede en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        asignatura:
          $ref: '#/components/schemas/AsignaturaBuscada'
        tarifa:
          type: integer
          minimum: 0
          description: Tarifa del tutor en esa asignatura, en pesos chilenos. 0 es una tutoría gratuita (RN-05).
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          description: Lo que ofrece el tutor en esa asignatura. Puede venir en null.
        reputacion:
          $ref: '#/components/schemas/Reputacion'

    TutorDestacado:
      type: object
      description: Un tutor de la búsqueda sin asignatura (HU-40), con todas sus asignaturas activas.
      required: [usuario_id, nombre, apellido, carrera_id, sede_id, reputacion, asignaturas]
      properties:
        usuario_id:
          type: string
          format: uuid
          description: Identificador del usuario en Identidad. Es el que pide `GET /tutores/{usuario_id}`.
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        carrera_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la carrera en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        sede_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la sede en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        reputacion:
          $ref: '#/components/schemas/Reputacion'
        asignaturas:
          type: array
          description: Sus asignaturas con perfil activo, ordenadas por sigla. Nunca viene vacía.
          items:
            $ref: '#/components/schemas/AsignaturaConTarifa'

    AsignaturaConTarifa:
      type: object
      description: Una asignatura del tutor, con su tarifa en ella.
      required: [asignatura_id, sigla, nombre, tarifa]
      properties:
        asignatura_id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150
        tarifa:
          type: integer
          minimum: 0
          description: En pesos chilenos. 0 es una tutoría gratuita (RN-05).

    AsignaturaBuscada:
      type: object
      description: La asignatura de la búsqueda, de la copia de lectura de Catálogo (`asignatura_ref`).
      required: [asignatura_id, sigla, nombre]
      properties:
        asignatura_id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150

    Reputacion:
      type: object
      description: |
        Reputación del tutor: el dato que guarda `usuario_ref` (RN-06). Se
        recalcula al evaluar (HU-25) y al retirar una evaluación (HU-33); la
        búsqueda y el perfil la leen tal cual, sin recalcularla.
      required: [promedio, total]
      properties:
        promedio:
          type: number
          minimum: 0
          maximum: 5
          description: Promedio de las calificaciones, de 0 a 5, con dos decimales como máximo. Se guarda como 4.50 y sale como 4.5.
        total:
          type: integer
          minimum: 0
          description: Cantidad de evaluaciones del promedio.

    PerfilPublico:
      type: object
      description: Perfil público de un tutor (HU-20, criterio 3).
      required: [usuario_id, nombre, apellido, carrera_id, sede_id, reputacion, asignaturas, bloques, evaluaciones]
      properties:
        usuario_id:
          type: string
          format: uuid
          description: Identificador del usuario en Identidad.
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        carrera_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la carrera en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        sede_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la sede en Catálogo. Viene en null si la copia del usuario en Tutorías no la tiene.
        reputacion:
          $ref: '#/components/schemas/Reputacion'
        asignaturas:
          type: array
          minItems: 1
          description: Sus perfiles activos, ordenados por sigla. Trae al menos uno; sin perfiles activos la respuesta es 404.
          items:
            $ref: '#/components/schemas/AsignaturaDelTutor'
        bloques:
          type: array
          maxItems: 20
          description: Bloques LIBRES que todavía no empiezan, del más próximo al más lejano. Puede venir vacía.
          items:
            $ref: '#/components/schemas/BloqueLibre'
        evaluaciones:
          type: array
          maxItems: 10
          description: Evaluaciones visibles, de la más nueva a la más antigua. Puede venir vacía.
          items:
            $ref: '#/components/schemas/EvaluacionPublica'

    AsignaturaDelTutor:
      type: object
      description: Una asignatura que el tutor tiene activa, con su tarifa y su descripción.
      required: [asignatura_id, sigla, nombre, tarifa, descripcion]
      properties:
        asignatura_id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150
        tarifa:
          type: integer
          minimum: 0
          description: En pesos chilenos. 0 es una tutoría gratuita (RN-05).
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          description: Puede venir en null.

    BloqueLibre:
      type: object
      description: Un bloque de disponibilidad LIBRE del tutor.
      required: [id, inicio_en, fin_en]
      properties:
        id:
          type: string
          format: uuid
        inicio_en:
          type: string
          format: date-time
          description: Inicio, en ISO 8601 y en UTC, con `Z`.
        fin_en:
          type: string
          format: date-time
          description: Término, posterior al inicio. En ISO 8601 y en UTC, con `Z`.

    EvaluacionPublica:
      type: object
      description: Una evaluación visible del tutor. No trae datos de quien evaluó.
      required: [calificacion, comentario, creada_en, asignatura]
      properties:
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          maxLength: 500
          nullable: true
          description: Puede venir en null.
        creada_en:
          type: string
          format: date-time
          description: Fecha de la evaluación, en ISO 8601 y en UTC, con `Z`.
        asignatura:
          $ref: '#/components/schemas/AsignaturaDeLaEvaluacion'

    AsignaturaDeLaEvaluacion:
      type: object
      description: La asignatura de la reserva evaluada.
      required: [sigla, nombre]
      properties:
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150

    Bloque:
      type: object
      description: Un bloque de disponibilidad del usuario del token (HU-15).
      required: [id, inicio_en, fin_en, estado, solicitudes_pendientes]
      properties:
        id:
          type: string
          format: uuid
        inicio_en:
          type: string
          format: date-time
          description: Inicio, en ISO 8601 y en UTC, con `Z` y sin fracción de segundo.
        fin_en:
          type: string
          format: date-time
          description: Término, posterior al inicio. En ISO 8601 y en UTC, con `Z` y sin fracción de segundo.
        estado:
          type: string
          enum: [LIBRE, OCUPADO]
          description: OCUPADO si tiene una tutoría confirmada, realizada o evaluada. Los bloques ELIMINADOS no salen.
        solicitudes_pendientes:
          type: integer
          minimum: 0
          description: Cuántas reservas en estado SOLICITADA tiene el bloque. Al publicar y al editar es 0.

    NuevoBloque:
      type: object
      description: Las fechas del bloque nuevo. Otros campos se ignoran.
      required: [inicio_en, fin_en]
      properties:
        inicio_en:
          type: string
          format: date-time
          description: ISO 8601 con la zona, `Z` o un desfase como `-03:00`.
        fin_en:
          type: string
          format: date-time
          description: ISO 8601 con la zona. Tiene que ser posterior al inicio.

    CambioDeBloque:
      type: object
      description: Lo que cambia del bloque; lo que no viene se conserva. Otros campos se ignoran.
      properties:
        inicio_en:
          type: string
          format: date-time
          description: ISO 8601 con la zona, `Z` o un desfase como `-03:00`.
        fin_en:
          type: string
          format: date-time
          description: ISO 8601 con la zona. Tiene que quedar posterior al inicio.

    Perfil:
      type: object
      description: Una asignatura que el usuario declaró que puede enseñar, con su tarifa (`perfil_tutor`, HU-14).
      required: [id, asignatura, tarifa, descripcion, activo, creado_en]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la asignatura declarada. Es el que pide `PATCH /perfiles/{perfil_id}`.
        asignatura:
          $ref: '#/components/schemas/AsignaturaDeclarada'
        tarifa:
          type: integer
          minimum: 0
          maximum: 99999999
          description: En pesos chilenos. 0 es una tutoría gratuita (RN-05).
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          description: Lo que ofrece en esa asignatura. Puede venir en null.
        activo:
          type: boolean
          description: false si el usuario la desactivó. Desactivada, no sale en la búsqueda ni en su perfil público.
        creado_en:
          type: string
          format: date-time
          description: Cuándo la declaró por primera vez. En ISO 8601 y en UTC, con `Z` y sin fracción de segundo.

    AsignaturaDeclarada:
      type: object
      description: La asignatura, de la copia de lectura de Catálogo (`asignatura_ref`).
      required: [asignatura_id, sigla, nombre]
      properties:
        asignatura_id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150

    NuevoPerfil:
      type: object
      description: La asignatura que se declara. Otros campos se ignoran.
      required: [asignatura_id, tarifa]
      properties:
        asignatura_id:
          type: string
          format: uuid
          description: El `id` de la asignatura en Catálogo, como lo entrega `GET /api/catalog/v1/carreras/{id}/asignaturas`.
        tarifa:
          type: integer
          minimum: 0
          maximum: 99999999
          description: En pesos chilenos, sin decimales. 0 es una tutoría gratuita.
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          description: Opcional. Se guarda sin los espacios de los lados; vacía queda en null.

    CambioDePerfil:
      type: object
      description: Lo que cambia; lo que no viene se conserva. Otros campos se ignoran.
      properties:
        tarifa:
          type: integer
          minimum: 0
          maximum: 99999999
          description: En pesos chilenos, sin decimales. No cambia el monto de las reservas ya creadas (A-04).
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          description: null la borra.
        activo:
          type: boolean
          description: false la desactiva; true la reactiva, revisando otra vez RN-01.

    CopiaRefrescada:
      type: object
      description: Resultado de `POST /yo/refrescar` (HU-41).
      required: [actualizada]
      properties:
        actualizada:
          type: boolean
          description: true si el usuario tenía copia en Tutorías y quedó al día; false si todavía no tiene copia.

    NuevaSolicitud:
      type: object
      description: La solicitud de una tutoría (HU-21). Otros campos se ignoran.
      required: [bloque_id, asignatura_id]
      properties:
        bloque_id:
          type: string
          format: uuid
          description: Un bloque LIBRE y futuro del tutor, como los entrega `GET /tutores/{usuario_id}` en `bloques`.
        asignatura_id:
          type: string
          format: uuid
          description: Una de las asignaturas del tutor, como las entrega `GET /tutores/{usuario_id}` en `asignaturas`.
        nota:
          type: string
          maxLength: 500
          nullable: true
          description: Opcional, para el tutor. Hasta 500 caracteres sin contar los espacios de los lados; vacía o en blanco se guarda en null.

    Reserva:
      type: object
      description: |
        Una reserva, vista por su solicitante o por su tutor (HU-21). No trae
        el correo de nadie (RNF-07).
      required: [id, estado, nota, modalidad, lugar_o_enlace, monto, estado_pago, creada_en, confirmada_en, cerrada_en, bloque, asignatura, tutor, solicitante, rol]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la reserva. Es el que piden `GET /reservas/{reserva_id}`, la confirmación, el rechazo, la cancelación y la evaluación.
        estado:
          type: string
          enum: [SOLICITADA, CONFIRMADA, RECHAZADA, EXPIRADA, CANCELADA, REALIZADA, EVALUADA]
          description: Nace SOLICITADA. Los cambios de estado los hacen otras historias (anexo A, sección 9).
        nota:
          type: string
          maxLength: 500
          nullable: true
          description: La nota del solicitante para el tutor. Puede venir en null.
        modalidad:
          type: string
          enum: [PRESENCIAL, EN_LINEA]
          nullable: true
          description: La fija el tutor al confirmar (HU-22). En null mientras no se confirma.
        lugar_o_enlace:
          type: string
          maxLength: 300
          nullable: true
          description: La sala o el enlace de la sesión, que fija el tutor al confirmar. En null mientras no se confirma.
        monto:
          type: integer
          minimum: 0
          description: La tarifa del tutor en esa asignatura al solicitar, en pesos chilenos. Es una copia congelada (ajuste A-04). 0 es una tutoría gratuita, sin pago (RN-05).
        estado_pago:
          type: string
          enum: [PENDIENTE, PAGADO, FALLIDO, REEMBOLSADO]
          nullable: true
          description: Lo informa Pagos (HU-23). En null al solicitar y mientras no haya un pago. Una tutoría gratuita no tiene.
        creada_en:
          type: string
          format: date-time
          description: Cuándo se solicitó. En ISO 8601 y en UTC, con `Z` y sin fracción de segundo.
        confirmada_en:
          type: string
          format: date-time
          nullable: true
          description: Cuándo la confirmó el tutor (HU-22), en UTC con `Z`. En null mientras no se confirma.
        cerrada_en:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se cerró la reserva, por ejemplo al rechazarla, al retirarla o cancelarla, o al evaluarla, en UTC con `Z`. En null mientras sigue abierta.
        bloque:
          $ref: '#/components/schemas/BloqueDeLaReserva'
        asignatura:
          $ref: '#/components/schemas/AsignaturaDeLaReserva'
        tutor:
          $ref: '#/components/schemas/PersonaDeLaReserva'
        solicitante:
          $ref: '#/components/schemas/PersonaDeLaReserva'
        rol:
          type: string
          enum: [estudiante, tutor]
          description: De qué lado está quien consulta. `estudiante` si la solicitó; `tutor` si es el dueño del bloque.

    BloqueDeLaReserva:
      type: object
      description: El bloque de la reserva. Su dueño es el tutor.
      required: [id, inicio_en, fin_en]
      properties:
        id:
          type: string
          format: uuid
        inicio_en:
          type: string
          format: date-time
          description: Inicio, en ISO 8601 y en UTC, con `Z` y sin fracción de segundo.
        fin_en:
          type: string
          format: date-time
          description: Término, posterior al inicio. En ISO 8601 y en UTC, con `Z` y sin fracción de segundo.

    AsignaturaDeLaReserva:
      type: object
      description: La asignatura de la tutoría, de la copia de lectura de Catálogo (`asignatura_ref`).
      required: [asignatura_id, sigla, nombre]
      properties:
        asignatura_id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 15
        nombre:
          type: string
          maxLength: 150

    PersonaDeLaReserva:
      type: object
      description: El tutor o el solicitante de la reserva, de la copia de lectura de Identidad (`usuario_ref`). Sin el correo (RNF-07).
      required: [usuario_id, nombre, apellido]
      properties:
        usuario_id:
          type: string
          format: uuid
          description: Identificador del usuario en Identidad.
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80

    Confirmacion:
      type: object
      description: La confirmación de una solicitud por el tutor (HU-22, RN-07). Otros campos se ignoran.
      required: [modalidad, lugar_o_enlace]
      properties:
        modalidad:
          type: string
          enum: [PRESENCIAL, EN_LINEA]
          description: Cómo será la tutoría, en mayúsculas.
        lugar_o_enlace:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            Presencial, el lugar de la sesión, por ejemplo la sede y la sala.
            En línea, el enlace de la sesión, que empieza con `http://` o
            `https://`. De 1 a 300 caracteres sin contar los espacios de los
            lados, que no se guardan.

    NuevaEvaluacion:
      type: object
      description: Datos para evaluar una tutoría realizada (HU-25). Otros campos se ignoran.
      required: [calificacion]
      properties:
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
          description: Nota entera de 1 a 5 estrellas.
        comentario:
          type: string
          maxLength: 500
          nullable: true
          description: Opcional, hasta 500 caracteres sin contar los espacios de los lados. Vacío o en blanco se guarda como null.

    EvaluacionRegistrada:
      type: object
      description: Evaluación recién creada para una reserva (HU-25).
      required: [id, reserva_id, calificacion, comentario, creada_en]
      properties:
        id:
          type: string
          format: uuid
        reserva_id:
          type: string
          format: uuid
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          maxLength: 500
          nullable: true
        creada_en:
          type: string
          format: date-time
          description: Cuándo se registró la evaluación, en ISO 8601 y en UTC, con `Z` y sin fracción de segundo.

    Estado:
      type: object
      description: Estado del servicio y de su base (HU-01).
      required: [servicio, estado, base_de_datos, version]
      properties:
        servicio:
          type: string
          description: El valor de la variable de entorno `NOMBRE_SERVICIO`, que en Docker Compose es `tutoring`. Sin la variable, `desconocido`.
        estado:
          type: string
          enum: [ok, degradado]
          description: ok si la base responde; degradado si no.
        base_de_datos:
          type: string
          enum: [ok, sin conexion]
        version:
          type: string
          description: La versión del servicio que tiene escrita la vista, hoy 0.1.0. No es la versión de este contrato.

    Error:
      type: object
      description: |
        Formato único de error de la API (Pilar 2, sección 11), el mismo de
        Identidad.

        - Errores con código propio: `detalles` = null. En las rutas de este
          contrato son asignatura_invalida, reputacion_invalida,
          busqueda_invalida, fecha_invalida, zona_horaria_requerida, fin_antes_de_inicio y
          bloque_en_el_pasado (400); not_authenticated, token_invalido,
          token_vencido y authentication_failed (401); no_es_tutor (403);
          not_found (404); bloque_solapado, bloque_con_solicitudes y
          bloque_con_reserva_confirmada (409), y claves_no_configuradas (503).
        - Con las asignaturas del tutor y la copia del usuario (HU-14 y
          HU-41) se suman usuario_requerido, tarifa_invalida,
          descripcion_invalida, activo_invalido, perfil_incompleto,
          carrera_no_valida y asignatura_no_habilitada (400); cuenta_inactiva
          (403); asignatura_ya_declarada (409), y servicio_no_disponible
          (503). asignatura_invalida también sale al declarar una asignatura.
        - Con la evaluación (HU-25) se suman calificacion_invalida y
          comentario_invalido (400), solo_el_solicitante (403),
          reserva_no_encontrada (404) y reserva_ya_evaluada,
          reserva_no_realizada y tutoria_no_terminada (409).
        - Con la solicitud y las reservas (HU-21) se suman bloque_invalido,
          nota_invalida, bloque_propio, asignatura_no_ofrecida, rol_invalido
          y estado_invalido (400); bloque_no_encontrado (404), y
          bloque_no_disponible y solicitud_duplicada (409).
          asignatura_invalida también sale al solicitar una tutoría, y
          bloque_en_el_pasado, al solicitar un bloque que ya empezó.
        - Con la confirmación y el rechazo de una solicitud (HU-22) se suman
          modalidad_invalida y lugar_o_enlace_invalido (400), y
          reserva_no_pendiente y bloque_ocupado (409). reserva_no_encontrada
          (404) también sale al confirmar o rechazar, y bloque_en_el_pasado,
          al confirmar una solicitud cuyo bloque ya empezó.
        - Con el retiro de una solicitud y la cancelación de una tutoría
          (HU-28) se suma reserva_no_cancelable (409). reserva_no_encontrada
          (404) también sale al cancelar, y bloque_en_el_pasado, al retirar o
          cancelar una reserva cuyo bloque ya empezó.
        - Errores de validación: `codigo` = `invalid`, `mensaje` = «La
          petición tiene datos inválidos.» y `detalles` = un objeto con una
          lista de mensajes por campo. Las rutas de este contrato no los dan.
        - Otros códigos los pone el framework: parse_error (JSON mal formado,
          400), method_not_allowed (405) si se usa un método que la ruta no
          acepta, y unsupported_media_type (415) si el cuerpo no es JSON ni un
          formulario.
      required: [codigo, mensaje, detalles]
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        detalles:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
