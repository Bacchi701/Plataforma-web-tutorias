openapi: 3.0.3

info:
  title: Tutorías · Plataforma de Tutorías entre Estudiantes
  version: 0.2.0
  description: |
    Contrato de la API pública de Tutorías (Pilar 2, sección 4.3).

    - Describe lo que hace Tutorías con HU-17, HU-20, HU-15, HU-14 y HU-41:
      la búsqueda de tutores y el perfil público de cada tutor (HU-20), los
      bloques de disponibilidad del tutor (HU-15), las asignaturas que el
      usuario declara que puede enseñar (HU-14), la copia de sus datos que
      guarda Tutorías (HU-41) y `/estado`, que existe desde HU-01.
    - Todas las rutas pasan por el gateway y llevan el prefijo y la versión
      del servicio, `/api/tutoring/v1/`, que va en `servers`.
    - Crece con cada historia que agrega rutas a Tutorías: HU-20 trajo la
      búsqueda y el perfil, HU-15 los bloques del tutor, y HU-14 y HU-41
      agregan las asignaturas del tutor y la copia de sus datos.
    - Un cambio a lo ya publicado se acuerda entre los tres antes de
      implementarse (acuerdo A4), como en Identidad. Los cambios y las rutas
      nuevas se anotan en «Cambios», al final de esta descripción.

    **Sesión (HU-17).** Tutorías no emite tokens: verifica el token de acceso
    que firma Identidad, un JWT RS256 (esquema `tokenAcceso`), con la clave
    pública, el emisor `identity` y las reclamaciones `sub`, `iat`, `exp` e
    `iss`. Va en la cabecera `Authorization: Bearer <token_acceso>`. Para
    saber quién hace la petición no le pregunta a Identidad: sale del token.
    - Las rutas de disponibilidad, las de `/perfiles` y `/yo/refrescar` piden
      el token: sin él responden 401 (`not_authenticated`).
    - `/estado`, `/tutores` y `/tutores/{usuario_id}` no piden token. Pero si
      la petición trae uno que no sirve (vencido, inválido o con la cabecera
      mal formada), responden 401 igual, porque Tutorías revisa el token
      antes de llegar a la ruta.
    - Si Tutorías no encuentra la clave pública, toda petición con token
      responde 503 `claves_no_configuradas` (ver
      `components/responses/ClavesNoConfiguradas`). Está en las rutas que
      siempre llevan token.

    **Formato de error (Pilar 2, sección 11).** Toda respuesta de error trae
    `codigo`, `mensaje` y `detalles` (ver el esquema `Error`, el mismo de
    Identidad). No lo traen el 503 de `/estado`, que responde con su propio
    esquema, como en Identidad, ni la página 404 que responde Django cuando
    la ruta no existe (ver `GET /tutores/{usuario_id}`).

    **Datos.**
    - La búsqueda, el perfil público, la disponibilidad y `GET /perfiles`
      salen de tutoring_db, sin llamar a Identidad ni a Catálogo (AD-07): el
      tutor y la asignatura vienen de las copias de lectura `usuario_ref` y
      `asignatura_ref`.
    - Esas copias se crean o se ponen al día cuando el usuario declara o
      reactiva una asignatura (HU-14, decisión T-166) y cuando la página
      pide `POST /yo/refrescar` al abrir y al guardar «Mi perfil» (HU-41). Para
      eso Tutorías pide a Identidad `GET /api/identity/v1/yo`, con el mismo
      token de la petición, y a Catálogo la malla de la carrera,
      `GET /api/catalog/v1/carreras/{id}/asignaturas`, que es pública. Si uno
      de los dos no responde en 3 segundos, la ruta responde 503
      `servicio_no_disponible` (`components/responses/SinOtroServicio`).
    - Ninguna respuesta trae el correo de nadie (RNF-07).
    - Los identificadores van como texto. La carrera y la sede van como
      identificador de Catálogo: el nombre se toma de
      `GET /api/catalog/v1/carreras` y `GET /api/catalog/v1/sedes`.
    - Las fechas van en ISO 8601, en UTC y con `Z`, por ejemplo
      `2026-10-24T21:00:00Z`: las de los bloques del tutor, sin fracción de
      segundo; las de la búsqueda y el perfil, con fracción si la hora
      guardada la tiene. El navegador las muestra en hora de Chile
      (`America/Santiago`). Las que recibe la API (`inicio_en` y `fin_en` de
      un bloque) tienen que traer la zona: `Z` o un desfase, como `-03:00`.
    - Los montos van como número entero de pesos chilenos. Una tarifa 0 es
      una tutoría gratuita (RN-05).

    **Cambios**
    - 0.1.0 (21-10-2026): primera versión, con `GET /tutores` y
      `GET /tutores/{usuario_id}` (HU-20), y `GET /estado` (HU-01).
    - 0.2.0 (23-10-2026): agrega los bloques de disponibilidad del
      tutor, con sesión (HU-15): `GET` y `POST /disponibilidad`, y `PATCH` y
      `DELETE /disponibilidad/{bloque_id}`, con el esquema de seguridad
      `tokenAcceso` (HU-17). A las rutas de la 0.1.0 les agrega el 401 que
      responden desde HU-17 si la petición trae un token que no sirve
      (`components/responses/TokenNoValido`), y deja solo el formato único
      de error, que con HU-17 es el único que sale.

    - Próxima versión, al cerrar el sprint 3 (HU-14 y HU-41): agrega las
      asignaturas que el usuario declara que puede enseñar, con sesión:
      `GET` y `POST /perfiles` y `PATCH /perfiles/{perfil_id}`, y
      `POST /yo/refrescar`, que pone al día la copia de sus datos. Con ellas,
      Tutorías consulta a Identidad y a Catálogo (ver «Datos») y suma los
      códigos de error de esas rutas (ver el esquema `Error`).

servers:
  - url: http://localhost:8080/api/tutoring/v1
    description: Gateway del sistema levantado con Docker Compose, con el prefijo y la versión de Tutorías. La API se llama siempre a través de él.

tags:
  - name: Búsqueda
    description: Búsqueda de tutores por asignatura y perfil público de cada tutor (HU-20). Sin sesión.
  - name: Disponibilidad
    description: Bloques de disponibilidad del tutor, con sesión (HU-15).
  - name: Asignaturas del tutor
    description: Las asignaturas que el usuario declara que puede enseñar, con su tarifa (HU-14). Con sesión.
  - name: Copia del usuario
    description: La copia de los datos del usuario que guarda Tutorías, `usuario_ref` (HU-41). Con sesión.
  - name: Estado
    description: Estado del servicio y de su base (HU-01).

paths:

  /tutores:
    get:
      tags: [Búsqueda]
      operationId: buscarTutores
      summary: Buscar los tutores de una asignatura
      description: |
        Lista los tutores con perfil activo en la asignatura (HU-20,
        criterios 1 y 2). Es pública: no pide token.

        - No salen el tutor con la cuenta desactivada (`usuario_ref.activo`,
          RN-08) ni el que tiene desactivado su perfil en esa asignatura
          (RN-01).
        - Orden: primero la reputación, de mayor a menor (el promedio y, si
          empata, la cantidad de evaluaciones); después la tarifa, de menor a
          mayor; y si todo eso empata, el nombre, el apellido y el
          identificador del tutor.
        - Cada tutor trae su tarifa y su descripción en esa asignatura.
        - No pagina: trae todos los tutores de la asignatura.
        - Una asignatura sin tutores, o que no está en Tutorías, responde 200
          con la lista vacía.
      security:
        - tokenAcceso: []
        - {}
      parameters:
        - name: asignatura
          in: query
          required: true
          description: |
            Identificador de la asignatura en Catálogo. Se recortan los
            espacios al inicio y al final. Se lee con `uuid.UUID` de Python,
            que también acepta mayúsculas y el uuid sin guiones.
          schema:
            type: string
            format: uuid
          example: 40000000-0000-4000-8000-000000000006
      responses:
        '200':
          description: Los tutores de la asignatura, en orden. La lista puede venir vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TutorEncontrado'
              examples:
                base_de_datos:
                  summary: Base de Datos (BDD1101), con una tutora
                  description: Datos de ejemplo de `data/seeds/demo`. Valentina enseña Base de Datos a $5.000 y tiene una evaluación, de 5.
                  value:
                    - usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                      carrera_id: 20000000-0000-4000-8000-000000000001
                      sede_id: 30000000-0000-4000-8000-000000000011
                      asignatura:
                        asignatura_id: 40000000-0000-4000-8000-000000000006
                        sigla: BDD1101
                        nombre: Base de Datos
                      tarifa: 5000
                      descripcion: Modelo entidad-relación, normalización y SQL.
                      reputacion:
                        promedio: 5.0
                        total: 1
                programacion:
                  summary: Programación de Algoritmos (PRO1101), con dos tutores en orden
                  description: Mismos datos de ejemplo. Valentina va primero porque tiene mejor reputación (5.0 con una evaluación, contra 0.0 sin evaluaciones).
                  value:
                    - usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                      carrera_id: 20000000-0000-4000-8000-000000000001
                      sede_id: 30000000-0000-4000-8000-000000000011
                      asignatura:
                        asignatura_id: 40000000-0000-4000-8000-000000000005
                        sigla: PRO1101
                        nombre: Programación de Algoritmos
                      tarifa: 0
                      descripcion: Te ayudo con algoritmos desde cero, con ejercicios guiados.
                      reputacion:
                        promedio: 5.0
                        total: 1
                    - usuario_id: 10000000-0000-4000-8000-000000000002
                      nombre: Matías
                      apellido: Fuentes
                      carrera_id: 20000000-0000-4000-8000-000000000002
                      sede_id: 30000000-0000-4000-8000-000000000004
                      asignatura:
                        asignatura_id: 40000000-0000-4000-8000-000000000005
                        sigla: PRO1101
                        nombre: Programación de Algoritmos
                      tarifa: 3000
                      descripcion: Resolución de guías y preparación de pruebas.
                      reputacion:
                        promedio: 0.0
                        total: 0
                sin_tutores:
                  summary: Contabilidad Básica (CON1101), sin tutores que mostrar
                  description: Mismos datos de ejemplo. Su única tutora, Josefa, tiene la cuenta desactivada (RN-08).
                  value: []
        '400':
          description: |
            Falta `asignatura`, viene vacía o solo con espacios
            (`asignatura_requerida`), o no es un uuid (`asignatura_invalida`).
            En los dos casos `detalles` viene en null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                asignatura_requerida:
                  summary: Sin el parámetro asignatura, o vacío
                  value:
                    codigo: asignatura_requerida
                    mensaje: 'Indica la asignatura con ?asignatura=<identificador>.'
                    detalles: null
                asignatura_invalida:
                  summary: Un valor que no es uuid, como ?asignatura=abc
                  value:
                    codigo: asignatura_invalida
                    mensaje: El identificador de la asignatura no es válido.
                    detalles: null
        '401':
          $ref: '#/components/responses/TokenNoValido'

  /tutores/{usuario_id}:
    get:
      tags: [Búsqueda]
      operationId: verPerfilDeTutor
      summary: Perfil público de un tutor
      description: |
        Datos públicos del tutor, con su reputación, sus asignaturas, sus
        próximos bloques libres y sus evaluaciones visibles (HU-20,
        criterio 3). Es pública: no pide token.

        - `asignaturas`: sus perfiles activos, ordenados por sigla, cada uno
          con su tarifa y su descripción.
        - `bloques`: los LIBRES que empiezan después del momento de la
          consulta, del más próximo al más lejano, hasta 20. No salen los
          OCUPADOS, los ELIMINADOS ni los que ya empezaron.
        - `evaluaciones`: las de las reservas sobre bloques del tutor, sin las
          que retiró el administrador (`retirada_en` nulo, CA7), de la más
          nueva a la más antigua, hasta 10. Pueden ser de cualquier
          asignatura, también de una que ya no tutorea. No traen datos de
          quien evaluó.
        - La reputación es la que guarda `usuario_ref` (RN-06): esta ruta no
          la recalcula.
      security:
        - tokenAcceso: []
        - {}
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: |
            Identificador del tutor, el `usuario_id` que entrega la búsqueda:
            un uuid en minúsculas y con guiones. Con otra forma la ruta no
            existe (ver la respuesta 404).
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          example: 10000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: El perfil público del tutor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
              examples:
                valentina:
                  summary: Valentina Soto, con dos asignaturas, dos bloques y una evaluación
                  description: |
                    Datos de ejemplo de `data/seeds/demo`, cargados el
                    21-10-2026: sus bloques libres futuros se calculan desde el
                    día de la carga. Tiene otra evaluación, de 1, que retiró el
                    administrador y no sale.
                  value:
                    usuario_id: 10000000-0000-4000-8000-000000000001
                    nombre: Valentina
                    apellido: Soto
                    carrera_id: 20000000-0000-4000-8000-000000000001
                    sede_id: 30000000-0000-4000-8000-000000000011
                    reputacion:
                      promedio: 5.0
                      total: 1
                    asignaturas:
                      - asignatura_id: 40000000-0000-4000-8000-000000000006
                        sigla: BDD1101
                        nombre: Base de Datos
                        tarifa: 5000
                        descripcion: Modelo entidad-relación, normalización y SQL.
                      - asignatura_id: 40000000-0000-4000-8000-000000000005
                        sigla: PRO1101
                        nombre: Programación de Algoritmos
                        tarifa: 0
                        descripcion: Te ayudo con algoritmos desde cero, con ejercicios guiados.
                    bloques:
                      - id: 60000000-0000-4000-8000-000000000013
                        inicio_en: '2026-10-24T21:00:00Z'
                        fin_en: '2026-10-24T22:00:00Z'
                      - id: 60000000-0000-4000-8000-000000000014
                        inicio_en: '2026-10-26T22:00:00Z'
                        fin_en: '2026-10-26T23:30:00Z'
                    evaluaciones:
                      - calificacion: 5
                        comentario: Explicó la normalización con ejemplos claros. Muy recomendable.
                        creada_en: '2026-09-22T13:00:00Z'
                        asignatura:
                          sigla: BDD1101
                          nombre: Base de Datos
                matias:
                  summary: Matías Fuentes, todavía sin evaluaciones
                  description: Mismos datos de ejemplo. Sin evaluaciones, `evaluaciones` viene vacía y la reputación en 0.
                  value:
                    usuario_id: 10000000-0000-4000-8000-000000000002
                    nombre: Matías
                    apellido: Fuentes
                    carrera_id: 20000000-0000-4000-8000-000000000002
                    sede_id: 30000000-0000-4000-8000-000000000004
                    reputacion:
                      promedio: 0.0
                      total: 0
                    asignaturas:
                      - asignatura_id: 40000000-0000-4000-8000-000000000005
                        sigla: PRO1101
                        nombre: Programación de Algoritmos
                        tarifa: 3000
                        descripcion: Resolución de guías y preparación de pruebas.
                      - asignatura_id: 40000000-0000-4000-8000-000000000008
                        sigla: WEB2101
                        nombre: Desarrollo Web
                        tarifa: 4000
                        descripcion: HTML, CSS y JavaScript para tus entregas.
                    bloques:
                      - id: 60000000-0000-4000-8000-000000000015
                        inicio_en: '2026-10-25T21:30:00Z'
                        fin_en: '2026-10-25T22:30:00Z'
                      - id: 60000000-0000-4000-8000-000000000016
                        inicio_en: '2026-10-27T13:00:00Z'
                        fin_en: '2026-10-27T14:00:00Z'
                    evaluaciones: []
        '404':
          description: |
            No hay un tutor activo con ese identificador: el usuario no está
            en Tutorías, su cuenta está desactivada (RN-08) o no tiene
            perfiles activos. Los tres casos responden lo mismo (`not_found`).

            Si `usuario_id` no es un uuid en minúsculas, la ruta no existe y
            responde Django con su página 404, en HTML y sin el formato de
            error de la API. Con `DJANGO_DEBUG=1`, el valor de `.env.example`,
            es la página de depuración de Django.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: not_found
                mensaje: No existe un tutor activo con ese identificador.
                detalles: null
            text/html:
              schema:
                type: string
              examples:
                ruta_inexistente:
                  summary: GET /tutores/abc con DJANGO_DEBUG=1 (recortada)
                  value: '<!DOCTYPE html><html lang="en"><head>...<title>Page not found at /api/tutoring/v1/tutores/abc</title>...</html>'
        '401':
          $ref: '#/components/responses/TokenNoValido'

  /disponibilidad:
    get:
      tags: [Disponibilidad]
      operationId: verMisBloques
      summary: Mis bloques de disponibilidad
      description: |
        Los bloques del usuario del token que no están ELIMINADOS y todavía no
        terminan, del más próximo al más lejano, cada uno con cuántas
        solicitudes pendientes tiene (HU-15). Un bloque que ya empezó y no ha
        terminado también sale.

        - Pide sesión, pero no ser tutor: quien dejó de serlo ve lo que
          publicó, para poder eliminarlo. Sin bloques, la lista viene vacía.
        - Trae solo los bloques del usuario del token. Los bloques libres de
          otro tutor están en su perfil público, `GET /tutores/{usuario_id}`;
          por eso esta ruta no lleva el `?tutor=` del Pilar 2 (sección 4.3).
        - No pagina.
      security:
        - tokenAcceso: []
      responses:
        '200':
          description: Los bloques, del más próximo al más lejano. La lista puede venir vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bloque'
              examples:
                valentina:
                  summary: Valentina, con sus dos bloques libres
                  description: |
                    Datos de ejemplo de `data/seeds/demo`, cargados el
                    21-10-2026: sus bloques libres futuros se calculan desde
                    el día de la carga. Los de septiembre y octubre ya
                    terminaron y no salen.
                  value:
                    - id: 60000000-0000-4000-8000-000000000013
                      inicio_en: '2026-10-24T21:00:00Z'
                      fin_en: '2026-10-24T22:00:00Z'
                      estado: LIBRE
                      solicitudes_pendientes: 0
                    - id: 60000000-0000-4000-8000-000000000014
                      inicio_en: '2026-10-26T22:00:00Z'
                      fin_en: '2026-10-26T23:30:00Z'
                      estado: LIBRE
                      solicitudes_pendientes: 0
                camila:
                  summary: Camila, que no es tutora y no tiene bloques
                  value: []
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'
    post:
      tags: [Disponibilidad]
      operationId: publicarBloque
      summary: Publicar un bloque
      description: |
        Publica un bloque LIBRE del usuario del token (HU-15, criterios 1
        y 2).

        - Solo publica un tutor: cuenta activa en Tutorías (`usuario_ref`) y
          al menos una asignatura activa (perfil). Si no, 403 `no_es_tutor`.
        - `inicio_en` y `fin_en` van en ISO 8601 con zona y se guardan en UTC.
          La página manda `toISOString()`, con `Z`.
        - Se revisa en este orden: ser tutor (403); la fecha de inicio y
          después la de término (400 `fecha_invalida` o
          `zona_horaria_requerida`); que el término sea posterior al inicio
          (400 `fin_antes_de_inicio`); que el inicio sea futuro (400
          `bloque_en_el_pasado`), y que no se cruce con otro bloque suyo (409
          `bloque_solapado`, RN-02).
        - El cruce lo rechaza la base (restricción `ex_bloque_sin_solape`): no
          cuentan los bloques ELIMINADOS, y uno que empieza justo cuando
          termina otro no se cruza.
        - Otros campos del cuerpo se ignoran.
      security:
        - tokenAcceso: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoBloque'
            examples:
              como_la_pagina:
                summary: Mañana de 18:00 a 19:00, hora de Chile, como lo manda la página
                value:
                  inicio_en: '2026-10-22T21:00:00.000Z'
                  fin_en: '2026-10-22T22:00:00.000Z'
              con_desfase:
                summary: Lo mismo, con el desfase de Chile en octubre
                value:
                  inicio_en: '2026-10-22T18:00:00-03:00'
                  fin_en: '2026-10-22T19:00:00-03:00'
      responses:
        '201':
          description: Bloque publicado. Queda LIBRE y sale en «Mis bloques» y en el perfil público del tutor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloque'
              example:
                id: 4b7e2c1a-9d3f-4e6b-8a5c-1f2e3d4c5b6a
                inicio_en: '2026-10-22T21:00:00Z'
                fin_en: '2026-10-22T22:00:00Z'
                estado: LIBRE
                solicitudes_pendientes: 0
        '400':
          $ref: '#/components/responses/FechasInvalidas'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/NoEsTutor'
        '409':
          description: El bloque se cruza con otro bloque suyo que no está ELIMINADO (RN-02).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_solapado:
                  $ref: '#/components/examples/BloqueSolapado'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /disponibilidad/{bloque_id}:
    patch:
      tags: [Disponibilidad]
      operationId: editarBloque
      summary: Cambiar un bloque libre
      description: |
        Cambia el inicio, el término o los dos de un bloque propio (HU-15,
        criterio 3). Basta con mandar lo que cambia: lo que no viene se
        conserva.

        Se revisa en este orden:
        - ser tutor, como al publicar (403 `no_es_tutor`), antes de buscar el
          bloque;
        - que el bloque sea suyo y no esté ELIMINADO (404);
        - que no tenga una tutoría confirmada, realizada o evaluada (409
          `bloque_con_reserva_confirmada`) ni solicitudes pendientes (409
          `bloque_con_solicitudes`);
        - las mismas reglas de fechas y de cruce que al publicar, sobre el
          bloque ya cambiado (400, y 409 `bloque_solapado`). Por eso un
          bloque que ya empezó no se puede editar (`bloque_en_el_pasado`).
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/BloqueId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioDeBloque'
            examples:
              las_dos_horas:
                summary: Pasar el bloque de mañana a las 19:00–20:00, hora de Chile
                value:
                  inicio_en: '2026-10-22T22:00:00.000Z'
                  fin_en: '2026-10-22T23:00:00.000Z'
              solo_el_termino:
                summary: Alargarlo hasta las 20:00, hora de Chile, sin cambiar el inicio
                value:
                  fin_en: '2026-10-22T23:00:00.000Z'
      responses:
        '200':
          description: Bloque cambiado. Sigue LIBRE y sin solicitudes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloque'
              example:
                id: 4b7e2c1a-9d3f-4e6b-8a5c-1f2e3d4c5b6a
                inicio_en: '2026-10-22T22:00:00Z'
                fin_en: '2026-10-22T23:00:00Z'
                estado: LIBRE
                solicitudes_pendientes: 0
        '400':
          $ref: '#/components/responses/FechasInvalidas'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/NoEsTutor'
        '404':
          $ref: '#/components/responses/BloqueNoEncontrado'
        '409':
          description: |
            El bloque tiene una tutoría confirmada, realizada o evaluada
            (`bloque_con_reserva_confirmada`), tiene solicitudes pendientes
            (`bloque_con_solicitudes`) o, con las horas nuevas, se cruza con
            otro bloque suyo (`bloque_solapado`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_con_reserva_confirmada:
                  $ref: '#/components/examples/ConReserva'
                bloque_con_solicitudes:
                  $ref: '#/components/examples/ConSolicitudes'
                bloque_solapado:
                  $ref: '#/components/examples/BloqueSolapado'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'
    delete:
      tags: [Disponibilidad]
      operationId: eliminarBloque
      summary: Eliminar un bloque
      description: |
        Elimina un bloque propio (HU-15, criterios 3, 4 y 5). No pide ser
        tutor: quien dejó de serlo puede retirar lo que publicó.

        - Si el bloque nunca tuvo reservas, se borra. Si tuvo alguna, queda
          ELIMINADO (borrado lógico) y deja de contar para los cruces.
        - Sus solicitudes pendientes pasan a RECHAZADA, con `cerrada_en`. El
          aviso por correo a cada estudiante llega con HU-16: hoy no se
          envía.
        - Con una tutoría confirmada, realizada o evaluada no se elimina (409
          `bloque_con_reserva_confirmada`).
        - Todo pasa en una transacción que bloquea el bloque.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/BloqueId'
      responses:
        '204':
          description: Bloque eliminado. La respuesta no trae cuerpo.
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '404':
          $ref: '#/components/responses/BloqueNoEncontrado'
        '409':
          description: El bloque tiene una tutoría confirmada, realizada o evaluada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_con_reserva_confirmada:
                  $ref: '#/components/examples/ConReserva'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /perfiles:
    get:
      tags: [Asignaturas del tutor]
      operationId: verAsignaturasDeclaradas
      summary: Las asignaturas que declaró un usuario
      description: |
        Las asignaturas que el usuario `usuario` declaró que puede enseñar,
        cada una con su tarifa, ordenadas por sigla (HU-14).

        - Si `usuario` es quien hace la petición, trae las activas y las
          desactivadas: es la lista de «Mi perfil».
        - Si es otro usuario, solo las activas, y ninguna si su cuenta está
          desactivada en Tutorías (RN-08).
        - No llama a otros servicios. No pagina.
      security:
        - tokenAcceso: []
      parameters:
        - name: usuario
          in: query
          required: true
          description: Identificador del usuario en Identidad, un uuid. Sin él, o si no es un uuid, responde 400 `usuario_requerido`.
          schema:
            type: string
            format: uuid
          example: 10000000-0000-4000-8000-000000000004
      responses:
        '200':
          description: Sus asignaturas declaradas, por sigla. La lista puede venir vacía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfil'
              examples:
                camila:
                  summary: Camila, pedida por ella misma, con una asignatura activa y otra desactivada
                  value:
                    - id: 7d1c2b3a-4e5f-4a6b-9c8d-0e1f2a3b4c5d
                      asignatura:
                        asignatura_id: 40000000-0000-4000-8000-000000000006
                        sigla: BDD1101
                        nombre: Base de Datos
                      tarifa: 0
                      descripcion: Modelo entidad-relación y consultas SQL.
                      activo: true
                      creado_en: '2026-10-29T18:10:00Z'
                    - id: 2f4e6a8c-1b3d-4f5a-8b7c-9d0e1f2a3b4c
                      asignatura:
                        asignatura_id: 40000000-0000-4000-8000-000000000001
                        sigla: MAT1101
                        nombre: Matemática Aplicada
                      tarifa: 4000
                      descripcion: null
                      activo: false
                      creado_en: '2026-10-29T18:12:00Z'
                diego:
                  summary: Diego, que no ha declarado asignaturas
                  value: []
        '400':
          description: Falta `usuario` o no es un uuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: usuario_requerido
                mensaje: 'Indica de quién son las asignaturas: ?usuario=<id del usuario>.'
                detalles: null
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'
    post:
      tags: [Asignaturas del tutor]
      operationId: declararAsignatura
      summary: Declarar una asignatura que puede enseñar
      description: |
        El usuario del token declara una asignatura que puede enseñar, con su
        tarifa (HU-14, RF-03). Desde ese momento aparece como tutor de esa
        asignatura en la búsqueda y puede publicar bloques (HU-15).

        Se revisa en este orden:
        1. El cuerpo, sin llamar a nadie: `asignatura_id` es un uuid (400
           `asignatura_invalida`); `tarifa` es un entero de 0 a 99.999.999,
           no un decimal, un texto ni un booleano (400 `tarifa_invalida`), y
           `descripcion`, si viene, es un texto de hasta 500 caracteres (400
           `descripcion_invalida`).
        2. Los datos del usuario, con una llamada a Identidad (`GET /yo`, con
           el mismo token), que crea o pone al día su copia, `usuario_ref`
           (decisión T-166). Si Identidad no reconoce la cuenta: 403
           `cuenta_inactiva`.
        3. Que tenga carrera y nivel en su perfil (400 `perfil_incompleto`).
        4. La malla vigente de su carrera, con una llamada a Catálogo. Si
           Catálogo no tiene esa carrera: 400 `carrera_no_valida`.
        5. RN-01: la asignatura tiene que estar en esa malla, en un semestre
           anterior al que cursa (400 `asignatura_no_habilitada`, con su
           nivel en el mensaje). En primer semestre no hay ninguna, y no se
           llama a Catálogo.
        6. En una transacción, crea o pone al día `asignatura_ref` con la
           sigla y el nombre de Catálogo, y después el perfil. Si no existía,
           lo crea activo (201). Si existía desactivado, lo reactiva con la
           tarifa y la descripción nuevas (200). Si ya estaba activo, 409
           `asignatura_ya_declarada`, también cuando dos envíos llegan a la
           vez (restricción `ux_perfil_usuario_asignatura`).

        - Una tarifa 0 es una tutoría gratuita (RN-05).
        - Si Identidad o Catálogo no responden: 503 `servicio_no_disponible`.
          Si es Identidad, no queda nada escrito; si es Catálogo, la copia del
          usuario puede quedar al día, pero no `asignatura_ref` ni el perfil.
        - La descripción se guarda sin los espacios de los lados; vacía queda
          en null. Otros campos del cuerpo se ignoran.
      security:
        - tokenAcceso: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPerfil'
            examples:
              gratuita:
                summary: Camila, en el semestre 2, declara Base de Datos, del semestre 1, gratis
                value:
                  asignatura_id: 40000000-0000-4000-8000-000000000006
                  tarifa: 0
                  descripcion: Modelo entidad-relación y consultas SQL.
              con_tarifa:
                summary: Matemática Aplicada, del semestre 1, a $4.000
                value:
                  asignatura_id: 40000000-0000-4000-8000-000000000001
                  tarifa: 4000
      responses:
        '200':
          description: La asignatura estaba declarada y desactivada. Queda activa otra vez, con la tarifa y la descripción nuevas, y el mismo `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '201':
          description: Asignatura declarada. Queda activa y sale en la búsqueda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
              example:
                id: 7d1c2b3a-4e5f-4a6b-9c8d-0e1f2a3b4c5d
                asignatura:
                  asignatura_id: 40000000-0000-4000-8000-000000000006
                  sigla: BDD1101
                  nombre: Base de Datos
                tarifa: 0
                descripcion: Modelo entidad-relación y consultas SQL.
                activo: true
                creado_en: '2026-10-29T18:10:00Z'
        '400':
          $ref: '#/components/responses/AsignaturaNoDeclarable'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '409':
          description: La asignatura ya está declarada y activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                asignatura_ya_declarada:
                  $ref: '#/components/examples/AsignaturaYaDeclarada'
        '503':
          $ref: '#/components/responses/SinOtroServicio'

  /perfiles/{perfil_id}:
    patch:
      tags: [Asignaturas del tutor]
      operationId: editarAsignaturaDeclarada
      summary: Cambiar la tarifa, la descripción o si está activa
      description: |
        Cambia una asignatura que declaró el usuario del token (HU-14,
        criterio 5). Basta con mandar lo que cambia: lo que no viene se
        conserva.

        - Solo la cambia su dueño: una de otro usuario o una que no existe
          responden el mismo 404, para no revelar que existe.
        - `tarifa` y `descripcion` tienen las reglas de `POST /perfiles` (400
          `tarifa_invalida` y `descripcion_invalida`), y `activo` es true o
          false (400 `activo_invalido`). `descripcion` en null la borra.
        - Cambiar la tarifa o la descripción, o desactivarla, no llama a otros
          servicios. Desactivada, deja de salir en la búsqueda y en el perfil
          público, y no cuenta para publicar bloques.
        - Pedir `activo: true` vuelve a revisar RN-01 como al declararla,
          aunque ya esté activa, porque la carrera o el nivel pueden haber
          cambiado: llama a Identidad y a Catálogo, y puede responder 400
          `perfil_incompleto`, `carrera_no_valida` o
          `asignatura_no_habilitada`, 403 `cuenta_inactiva` o 503.
        - El monto de las reservas ya creadas no cambia: es una copia de la
          tarifa del momento en que se solicitaron (ajuste A-04).
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/PerfilId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioDePerfil'
            examples:
              tarifa:
                summary: Subir la tarifa a $5.000
                value:
                  tarifa: 5000
              desactivar:
                summary: Dejar de enseñarla por ahora
                value:
                  activo: false
      responses:
        '200':
          description: La asignatura declarada, con los cambios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
              example:
                id: 2f4e6a8c-1b3d-4f5a-8b7c-9d0e1f2a3b4c
                asignatura:
                  asignatura_id: 40000000-0000-4000-8000-000000000001
                  sigla: MAT1101
                  nombre: Matemática Aplicada
                tarifa: 5000
                descripcion: null
                activo: true
                creado_en: '2026-10-29T18:12:00Z'
        '400':
          description: |
            Un campo no sirve (`tarifa_invalida`, `descripcion_invalida` o
            `activo_invalido`) o, al reactivarla, RN-01 ya no la habilita
            (`perfil_incompleto`, `carrera_no_valida` o
            `asignatura_no_habilitada`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tarifa_invalida:
                  $ref: '#/components/examples/TarifaInvalida'
                activo_invalido:
                  $ref: '#/components/examples/ActivoInvalido'
                asignatura_no_habilitada:
                  $ref: '#/components/examples/AsignaturaNoHabilitada'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '404':
          $ref: '#/components/responses/PerfilNoEncontrado'
        '503':
          $ref: '#/components/responses/SinOtroServicio'

  /yo/refrescar:
    post:
      tags: [Copia del usuario]
      operationId: refrescarMiCopia
      summary: Poner al día la copia de mis datos en Tutorías
      description: |
        Tutorías pide a Identidad los datos del usuario del token (`GET /yo`,
        con el mismo token) y pone al día su copia, `usuario_ref`: nombre,
        apellido, carrera y sede (HU-41). Así la búsqueda y el perfil público
        muestran el nombre nuevo.

        - La página «Mi perfil» la llama al abrirse y después de guardar el
          perfil en Identidad. Si Tutorías no responde, el perfil igual quedó
          guardado en Identidad, y la copia se pone al día la próxima vez: al
          abrir o guardar otra vez «Mi perfil», o al declarar una asignatura.
        - Si el usuario todavía no tiene copia en Tutorías, no se crea ni se
          llama a Identidad: la copia nace con su primer contacto, al declarar
          una asignatura (M-09 del anexo A). Responde `actualizada: false`.
        - Si Identidad no reconoce la cuenta: 403 `cuenta_inactiva`, y la
          copia queda desactivada, fuera de la búsqueda (RN-08).
        - No toca la reputación. No lleva cuerpo.
      security:
        - tokenAcceso: []
      responses:
        '200':
          description: Lo que pasó con la copia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopiaRefrescada'
              examples:
                actualizada:
                  summary: Camila, que ya tiene copia en Tutorías
                  value:
                    actualizada: true
                sin_copia:
                  summary: Un usuario que todavía no ha declarado asignaturas ni tiene copia
                  value:
                    actualizada: false
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '503':
          $ref: '#/components/responses/SinOtroServicio'

  /estado:
    get:
      tags: [Estado]
      operationId: estadoTutorias
      summary: Estado del servicio y de su base
      description: |
        Dice si el servicio está arriba y puede leer su base, que prueba con
        un `SELECT 1` (HU-01). Lo consultan la integración continua (trabajo
        «levantar», que espera un 200) y la verificación de salud del
        contenedor en `docker-compose.yml`. Es pública: no pide token.

        Si la base no responde, no es un error de la API: responde 503 con
        el mismo esquema, con `estado` en `degradado`.
      security:
        - tokenAcceso: []
        - {}
      responses:
        '200':
          description: El servicio y su base responden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: tutoring
                estado: ok
                base_de_datos: ok
                version: 0.1.0
        '503':
          description: El servicio arrancó, pero no puede leer su base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: tutoring
                estado: degradado
                base_de_datos: sin conexion
                version: 0.1.0
        '401':
          $ref: '#/components/responses/TokenNoValido'

components:

  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cabecera `Authorization: Bearer <token_acceso>`. Es el token de acceso que firma Identidad, un JWT RS256 de 30 minutos (ver su contrato). Tutorías verifica la firma con la clave pública.'

  headers:
    DesafioBearer:
      description: Siempre `Bearer realm="tutoring"`.
      schema:
        type: string
      example: 'Bearer realm="tutoring"'

  parameters:
    BloqueId:
      name: bloque_id
      in: path
      required: true
      description: |
        Identificador del bloque, el `id` que entregan `GET` y
        `POST /disponibilidad`: un uuid en minúsculas y con guiones. Con otra
        forma la ruta no existe (ver la respuesta 404).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 4b7e2c1a-9d3f-4e6b-8a5c-1f2e3d4c5b6a
    PerfilId:
      name: perfil_id
      in: path
      required: true
      description: |
        Identificador de la asignatura declarada, el `id` que entregan `GET`
        y `POST /perfiles`: un uuid en minúsculas y con guiones. Con otra
        forma la ruta no existe (ver la respuesta 404).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 7d1c2b3a-4e5f-4a6b-9c8d-0e1f2a3b4c5d

  responses:
    TokenNoValido:
      description: |
        La petición trae un token en `Authorization: Bearer …` que no sirve.
        La ruta no pide token, pero si viene, Tutorías lo revisa antes de
        llegar a ella (HU-17). Los códigos posibles son:
        - `token_invalido`: el token está mal formado, su firma o su emisor
          no calzan, le falta una reclamación obligatoria o su `sub` no es un
          uuid;
        - `token_vencido`: el token venció (dura 30 minutos);
        - `authentication_failed`: la cabecera trae `Bearer` sin el token, o
          algo más después del token.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/DesafioBearer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalido:
              $ref: '#/components/examples/TokenInvalido'
            token_vencido:
              $ref: '#/components/examples/TokenVencido'
            cabecera_mal_formada:
              $ref: '#/components/examples/CabeceraMalFormada'
    SinTokenValido:
      description: |
        Sin un token válido (HU-17). Los códigos posibles son:
        - `not_authenticated`: no viene la cabecera
          `Authorization: Bearer …` (el mensaje es el estándar de Django REST
          Framework);
        - `token_invalido`, `token_vencido` y `authentication_failed`, como en
          `TokenNoValido`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/DesafioBearer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalido:
              $ref: '#/components/examples/TokenInvalido'
            token_vencido:
              $ref: '#/components/examples/TokenVencido'
            cabecera_mal_formada:
              $ref: '#/components/examples/CabeceraMalFormada'
    ClavesNoConfiguradas:
      description: |
        Tutorías no encuentra la clave pública con que verifica el token
        (`keys/jwt_public.pem`, que docker-compose.yml monta en `/app/keys`).
        Pasa en un clon nuevo si no se generaron las claves.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: claves_no_configuradas
            mensaje: 'No existe el archivo /app/keys/jwt_public.pem. Tutorías verifica los tokens con la clave pública de Identidad, keys/jwt_public.pem, que docker-compose.yml monta en /app/keys. Si faltan las claves, se generan en Identidad con: python manage.py generar_claves_jwt (ver el RUNBOOK, nivel 3).'
            detalles: null
    FechasInvalidas:
      description: |
        Las fechas del bloque no sirven. Los códigos posibles son:
        - `fecha_invalida`: `inicio_en` o `fin_en` no es una fecha ISO 8601,
          o falta al publicar;
        - `zona_horaria_requerida`: la fecha no trae la zona;
        - `fin_antes_de_inicio`: el término no es posterior al inicio;
        - `bloque_en_el_pasado`: el inicio ya pasó (al editar, también si el
          bloque ya empezó).

        Con `fin_en`, los dos primeros dicen «término» en vez de «inicio».
        Si el cuerpo no es JSON válido, responde `parse_error`, con el mensaje
        del framework.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            fecha_invalida:
              $ref: '#/components/examples/FechaInvalida'
            zona_horaria_requerida:
              $ref: '#/components/examples/ZonaHorariaRequerida'
            fin_antes_de_inicio:
              $ref: '#/components/examples/FinAntesDeInicio'
            bloque_en_el_pasado:
              $ref: '#/components/examples/BloqueEnElPasado'
    NoEsTutor:
      description: |
        El usuario del token no es tutor: su cuenta no está activa en
        Tutorías o no tiene ninguna asignatura activa. El mensaje pide
        declarar primero una asignatura.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            no_es_tutor:
              $ref: '#/components/examples/NoEsTutor'
    BloqueNoEncontrado:
      description: |
        El usuario del token no tiene un bloque con ese identificador: no
        existe, es de otro usuario o ya está ELIMINADO. Los tres casos
        responden lo mismo, para no revelar que el bloque existe.

        Si `bloque_id` no es un uuid en minúsculas, la ruta no existe y
        responde Django con su página 404, en HTML y sin el formato de error
        de la API, como en `GET /tutores/{usuario_id}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: not_found
            mensaje: No tienes un bloque con ese identificador.
            detalles: null
        text/html:
          schema:
            type: string
          examples:
            ruta_inexistente:
              summary: DELETE /disponibilidad/abc con DJANGO_DEBUG=1 (recortada)
              value: '<!DOCTYPE html><html lang="en"><head>...<title>Page not found at /api/tutoring/v1/disponibilidad/abc</title>...</html>'
    AsignaturaNoDeclarable:
      description: |
        La asignatura no se puede declarar. Los códigos posibles, en el orden
        en que se revisan, son:
        - `asignatura_invalida`: falta `asignatura_id` o no es un uuid;
        - `tarifa_invalida`: falta `tarifa`, o no es un entero de 0 a
          99.999.999;
        - `descripcion_invalida`: no es un texto, tiene más de 500
          caracteres o trae caracteres que no se pueden guardar, como el nulo;
        - `perfil_incompleto`: el usuario no tiene carrera o nivel en su
          perfil de Identidad;
        - `carrera_no_valida`: Catálogo no tiene su carrera activa;
        - `asignatura_no_habilitada`: no está en la malla vigente de su
          carrera, en un semestre anterior al que cursa (RN-01).

        Si el cuerpo no es JSON válido, responde `parse_error`, con el mensaje
        del framework.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            asignatura_invalida:
              $ref: '#/components/examples/AsignaturaInvalida'
            tarifa_invalida:
              $ref: '#/components/examples/TarifaInvalida'
            descripcion_invalida:
              $ref: '#/components/examples/DescripcionInvalida'
            perfil_incompleto:
              $ref: '#/components/examples/PerfilIncompleto'
            carrera_no_valida:
              $ref: '#/components/examples/CarreraNoValida'
            asignatura_no_habilitada:
              $ref: '#/components/examples/AsignaturaNoHabilitada'
    CuentaInactiva:
      description: |
        Identidad no reconoce la cuenta del token: no existe o está
        desactivada. Si tenía copia en Tutorías, la copia queda desactivada y
        deja de salir en la búsqueda (RN-08).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: cuenta_inactiva
            mensaje: La cuenta no existe o está desactivada.
            detalles: null
    PerfilNoEncontrado:
      description: |
        El usuario del token no tiene una asignatura declarada con ese
        identificador: no existe o es de otro usuario. Los dos casos responden
        lo mismo, para no revelar que existe.

        Si `perfil_id` no es un uuid en minúsculas, la ruta no existe y
        responde Django con su página 404, en HTML, como en
        `PATCH /disponibilidad/{bloque_id}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: not_found
            mensaje: No tienes una asignatura declarada con ese identificador.
            detalles: null
    SinOtroServicio:
      description: |
        Tutorías no pudo consultar a Identidad o a Catálogo: no responde, se
        demora más de 3 segundos o responde con un error 5xx. El código es
        `servicio_no_disponible` y el mensaje dice qué servicio falló.

        También puede ser `claves_no_configuradas`, si falta la clave pública
        (ver `ClavesNoConfiguradas`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            identidad:
              summary: Identidad no responde
              value:
                codigo: servicio_no_disponible
                mensaje: No pudimos comunicarnos con el servicio de Identidad. Intenta de nuevo en unos minutos.
                detalles: null
            catalogo:
              summary: Catálogo no responde
              value:
                codigo: servicio_no_disponible
                mensaje: No pudimos comunicarnos con el servicio de Catálogo. Intenta de nuevo en unos minutos.
                detalles: null

  examples:
    TokenInvalido:
      summary: El token no es válido
      value:
        codigo: token_invalido
        mensaje: El token de acceso no es válido.
        detalles: null
    TokenVencido:
      summary: El token venció
      value:
        codigo: token_vencido
        mensaje: El token de acceso venció.
        detalles: null
    CabeceraMalFormada:
      summary: Authorization trae Bearer sin el token
      value:
        codigo: authentication_failed
        mensaje: La cabecera Authorization está mal formada.
        detalles: null
    FechaInvalida:
      summary: inicio_en no es una fecha ISO 8601, como «mañana a las 18:00»
      value:
        codigo: fecha_invalida
