  /reservas/{reserva_id}/confirmar:
    post:
      tags: [Reservas]
      operationId: confirmarSolicitud
      summary: Confirmar una solicitud
      description: |
        El tutor confirma una solicitud que recibió, con la modalidad y el
        lugar o el enlace de la sesión (HU-22). Solo puede hacerlo el tutor de
        la reserva, que es el dueño de su bloque.

        Se revisa en este orden:
        1. El cuerpo, antes de tocar la base (RN-07): `modalidad` es
           `PRESENCIAL` o `EN_LINEA` (400 `modalidad_invalida`), y
           `lugar_o_enlace` es un texto de 1 a 300 caracteres sin contar los
           espacios de los lados, sin caracteres que no se pueden guardar,
           como el nulo, y que en línea empieza con `http://` o `https://`
           (400 `lugar_o_enlace_invalido`). El mensaje dice qué falta.
        2. En una transacción, siempre en este orden: lee la reserva sin
           bloquearla, solo para saber su bloque y que el bloque es del
           usuario del token (si la reserva no existe o el bloque no es suyo,
           por ejemplo porque es quien la solicitó: 404
           `reserva_no_encontrada`); bloquea el bloque
           (`SELECT … FOR UPDATE`), y vuelve a leer la reserva, ahora
           bloqueada. Así dos confirmaciones del mismo bloque, o una
           confirmación y un rechazo, se esperan: la segunda ve lo que dejó
           la primera. Recién ahí revisa:
           - que la reserva siga SOLICITADA (409 `reserva_no_pendiente`);
           - que el bloque no haya empezado (400 `bloque_en_el_pasado`);
           - que el bloque no esté OCUPADO (409 `bloque_ocupado`).
        3. La reserva pasa a CONFIRMADA, con la modalidad, el lugar o el
           enlace y `confirmada_en`; el bloque pasa a OCUPADO, y las demás
           solicitudes SOLICITADA del bloque pasan a RECHAZADA, con
           `cerrada_en` (RN-03). Si aun así la base ya tiene otra reserva que
           ocupa el bloque, la rechaza (restricción
           `ux_reserva_bloque_ocupado`): 409 `bloque_ocupado`, sin cambiar
           nada.

        - `estado_pago` queda en null al confirmar, también si la tutoría
          tiene tarifa: pasa a PENDIENTE cuando Pagos crea el pago (HU-23,
          decisión T-174).
        - Después de guardar, Tutorías pide a Identidad el aviso
          RESERVA_CONFIRMADA para el estudiante, y RESERVA_RECHAZADA para
          cada estudiante cuya solicitud quedó rechazada (HU-16). Si un aviso
          no sale, la confirmación queda igual.
        - Otros campos del cuerpo se ignoran.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmacion'
            examples:
              en_linea:
                summary: Valentina confirma en línea, con el enlace de la sesión
                value:
                  modalidad: EN_LINEA
                  lugar_o_enlace: 'https://meet.google.com/abc-defg-hij'
              presencial:
                summary: Valentina confirma presencial, con el lugar
                value:
                  modalidad: PRESENCIAL
                  lugar_o_enlace: Sede Alameda, biblioteca, sala de estudio 2
      responses:
        '200':
          description: La reserva CONFIRMADA, vista por el tutor. El bloque queda OCUPADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              examples:
                camila:
                  summary: Valentina confirma en línea la solicitud de Camila
                  description: |
                    La solicitud del ejemplo de `POST /reservas`, con los datos
                    de `data/seeds/demo` cargados el 08-11-2026. Tiene tarifa,
                    y `estado_pago` sigue en null (T-174).
                  value:
                    id: 2b6f1c3e-8a4d-4e7b-9c1f-5d3a7e9b0c2a
                    estado: CONFIRMADA
                    nota: Quiero repasar normalización antes del certamen.
                    modalidad: EN_LINEA
                    lugar_o_enlace: 'https://meet.google.com/abc-defg-hij'
                    monto: 5000
                    estado_pago: null
                    creada_en: '2026-11-08T22:15:04Z'
                    confirmada_en: '2026-11-08T22:40:31Z'
                    cerrada_en: null
                    bloque:
                      id: 60000000-0000-4000-8000-000000000013
                      inicio_en: '2026-11-11T21:00:00Z'
                      fin_en: '2026-11-11T22:00:00Z'
                    asignatura:
                      asignatura_id: 40000000-0000-4000-8000-000000000006
                      sigla: BDD1101
                      nombre: Base de Datos
                    tutor:
                      usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                    solicitante:
                      usuario_id: 10000000-0000-4000-8000-000000000004
                      nombre: Camila
                      apellido: Rojas
                    rol: tutor
        '400':
          description: |
            La confirmación no sirve. Los códigos posibles, en el orden en que
            se revisan, son:
            - `modalidad_invalida`: falta `modalidad` o no es `PRESENCIAL` ni
              `EN_LINEA`;
            - `lugar_o_enlace_invalido`: falta `lugar_o_enlace`, está vacío o
              solo con espacios, no es un texto, tiene más de 300 caracteres
              o caracteres que no se pueden guardar, o, en línea, no empieza
              con `http://` o `https://`. Si falta, el mensaje pide el lugar o
              el enlace, según la modalidad;
            - `bloque_en_el_pasado`: el bloque de la reserva ya empezó.

            Si el cuerpo no es JSON válido, responde `parse_error`, con el
            mensaje del framework.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                modalidad_invalida:
                  $ref: '#/components/examples/ModalidadInvalida'
                sin_lugar:
                  $ref: '#/components/examples/SinLugar'
                sin_enlace:
                  $ref: '#/components/examples/SinEnlace'
                lugar_no_es_texto:
                  $ref: '#/components/examples/LugarNoEsTexto'
                lugar_con_caracteres:
                  $ref: '#/components/examples/LugarConCaracteres'
                lugar_largo:
                  $ref: '#/components/examples/LugarLargo'
                enlace_invalido:
                  $ref: '#/components/examples/EnlaceInvalido'
                bloque_en_el_pasado:
                  $ref: '#/components/examples/TutoriaQueYaEmpezo'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '404':
          description: |
            La reserva no existe o su bloque no es del usuario del token, por
            ejemplo si es quien la solicitó (`reserva_no_encontrada`). Los
            casos responden igual, para no revelar que existe. Si
            `reserva_id` no es un uuid en minúsculas, la ruta no existe y
            responde Django con su página 404 en HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: reserva_no_encontrada
                mensaje: No encontramos esa tutoría.
                detalles: null
        '409':
          description: |
            La reserva ya no está SOLICITADA, por ejemplo porque ya se
            confirmó, se rechazó o se canceló (`reserva_no_pendiente`), o el
            bloque ya tiene otra tutoría confirmada (`bloque_ocupado`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reserva_no_pendiente:
                  $ref: '#/components/examples/ReservaNoPendiente'
                bloque_ocupado:
                  $ref: '#/components/examples/BloqueOcupado'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /reservas/{reserva_id}/rechazar:
    post:
      tags: [Reservas]
      operationId: rechazarSolicitud
      summary: Rechazar una solicitud
      description: |
        El tutor rechaza una solicitud que recibió (HU-22). Sin cuerpo: si
        viene uno, se ignora. Solo puede hacerlo el tutor de la reserva, que es
        el dueño de su bloque.

        - Bloquea en el mismo orden que la confirmación (la reserva sin
          bloquear, el bloque y la reserva bloqueada), porque un rechazo puede
          llegar al mismo tiempo que una confirmación del mismo bloque.
        - Si la reserva no existe o su bloque no es del usuario del token: 404
          `reserva_no_encontrada`. Si ya no está SOLICITADA: 409
          `reserva_no_pendiente`.
        - La reserva pasa a RECHAZADA, con `cerrada_en`. El bloque no cambia:
          sigue LIBRE y acepta otras solicitudes. No revisa la hora del
          bloque: también se puede rechazar una solicitud cuyo bloque ya
          empezó.
        - Después de guardar, Tutorías pide a Identidad el aviso
          RESERVA_RECHAZADA para el estudiante (HU-16). Si el aviso no sale,
          el rechazo queda igual.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      responses:
        '200':
          description: La reserva RECHAZADA, vista por el tutor. El bloque no cambia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              examples:
                diego:
                  summary: Valentina rechaza la solicitud antigua de Diego
                  description: |
                    Datos de ejemplo de `data/seeds/demo`: la reserva 004, en
                    un bloque de Valentina del 05-10-2026, que sigue
                    SOLICITADA.
                  value:
                    id: 70000000-0000-4000-8000-000000000004
                    estado: RECHAZADA
                    nota: Necesito repasar ciclos y arreglos antes de la prueba.
                    modalidad: null
                    lugar_o_enlace: null
                    monto: 0
                    estado_pago: null
                    creada_en: '2026-09-29T18:00:00Z'
                    confirmada_en: null
                    cerrada_en: '2026-11-08T22:47:12Z'
                    bloque:
                      id: 60000000-0000-4000-8000-000000000004
                      inicio_en: '2026-10-05T20:00:00Z'
                      fin_en: '2026-10-05T21:00:00Z'
                    asignatura:
                      asignatura_id: 40000000-0000-4000-8000-000000000005
                      sigla: PRO1101
                      nombre: Programación de Algoritmos
                    tutor:
                      usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                    solicitante:
                      usuario_id: 10000000-0000-4000-8000-000000000005
                      nombre: Diego
                      apellido: Herrera
                    rol: tutor
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '404':
          description: |
            La reserva no existe o su bloque no es del usuario del token, por
            ejemplo si es quien la solicitó (`reserva_no_encontrada`). Los
            casos responden igual, para no revelar que existe. Si
            `reserva_id` no es un uuid en minúsculas, la ruta no existe y
            responde Django con su página 404 en HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: reserva_no_encontrada
                mensaje: No encontramos esa tutoría.
                detalles: null
        '409':
          description: |
            La reserva ya no está SOLICITADA, por ejemplo porque ya se
            confirmó, se rechazó o se canceló (`reserva_no_pendiente`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reserva_no_pendiente:
                  $ref: '#/components/examples/ReservaNoPendiente'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /reservas/{reserva_id}/cancelar:
    post:
      tags: [Reservas]
      operationId: cancelarReserva
      summary: Retirar una solicitud o cancelar una tutoría confirmada
      description: |
        Libera el horario cuando una de las partes no puede asistir (HU-28,
        RN-04). Sin cuerpo: si viene uno, se ignora.

        - Retirar: el estudiante que la solicitó retira su solicitud mientras
          sigue SOLICITADA, es decir, mientras el tutor no le responde. El
          tutor no retira una solicitud: la rechaza
          (`POST /reservas/{reserva_id}/rechazar`).
        - Cancelar: cualquiera de las dos partes, el estudiante o el tutor (el
          dueño del bloque), cancela una tutoría CONFIRMADA que todavía no
          empieza.

        Se revisa en este orden:
        1. Sin bloquear nada: si la reserva no existe o el usuario del token
           no es su solicitante ni su tutor, 404 `reserva_no_encontrada`,
           como `GET /reservas/{reserva_id}`: los casos responden igual, para
           no revelar que existe.
        2. En una transacción, en el mismo orden que la confirmación: bloquea
           el bloque (`SELECT … FOR UPDATE`) y vuelve a leer la reserva, ahora
           bloqueada. Así una cancelación y una confirmación del mismo bloque
           se esperan: la segunda ve lo que dejó la primera. Recién ahí revisa:
           - que la reserva esté SOLICITADA o CONFIRMADA; si no (RECHAZADA,
             EXPIRADA, CANCELADA, REALIZADA o EVALUADA), 409
             `reserva_no_cancelable`, con el estado en el mensaje;
           - que una reserva SOLICITADA la retire su solicitante; si la pide
             el tutor, 409 `reserva_no_cancelable`;
           - que el bloque no haya empezado (400 `bloque_en_el_pasado`),
             también si la reserva sigue SOLICITADA.
        3. La reserva pasa a CANCELADA, con `cerrada_en`, y queda registrado
           en la base quién la retiró o la canceló. Si estaba CONFIRMADA, el
           bloque vuelve a LIBRE y acepta solicitudes nuevas. Si estaba
           SOLICITADA, el bloque no cambia: nunca estuvo ocupado.

        - Después de guardar, Tutorías pide a Identidad el aviso
          RESERVA_CANCELADA para la otra parte (HU-16): para el tutor si
          retira o cancela el estudiante, y para el estudiante si cancela el
          tutor. Si el aviso no sale, la cancelación queda igual.
        - Responde la reserva leída de nuevo después de guardar, con el
          esquema `Reserva` de HU-21 y `rol` según quién la retiró o la
          canceló. Quién canceló no sale en la respuesta.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      responses:
        '200':
          description: La reserva CANCELADA, vista por quien la retiró o la canceló. Si estaba CONFIRMADA, el bloque queda LIBRE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              examples:
                camila_retira:
                  summary: Camila retira su solicitud antes de que Valentina le responda
                  description: |
                    La solicitud del ejemplo de `POST /reservas`, con los datos
                    de `data/seeds/demo` cargados el 08-11-2026. El bloque 013
                    sigue LIBRE.
                  value:
                    id: 2b6f1c3e-8a4d-4e7b-9c1f-5d3a7e9b0c2a
                    estado: CANCELADA
                    nota: Quiero repasar normalización antes del certamen.
                    modalidad: null
                    lugar_o_enlace: null
                    monto: 5000
                    estado_pago: null
                    creada_en: '2026-11-08T22:15:04Z'
                    confirmada_en: null
                    cerrada_en: '2026-11-08T22:31:47Z'
                    bloque:
                      id: 60000000-0000-4000-8000-000000000013
                      inicio_en: '2026-11-11T21:00:00Z'
                      fin_en: '2026-11-11T22:00:00Z'
                    asignatura:
                      asignatura_id: 40000000-0000-4000-8000-000000000006
                      sigla: BDD1101
                      nombre: Base de Datos
                    tutor:
                      usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                    solicitante:
                      usuario_id: 10000000-0000-4000-8000-000000000004
                      nombre: Camila
                      apellido: Rojas
                    rol: estudiante
                valentina_cancela:
                  summary: Valentina cancela la tutoría que le confirmó a Camila
                  description: |
                    La tutoría del ejemplo de la confirmación, cancelada al
                    día siguiente. La modalidad, el enlace y `confirmada_en`
                    quedan como estaban, y el bloque 013 vuelve a LIBRE.
                  value:
                    id: 2b6f1c3e-8a4d-4e7b-9c1f-5d3a7e9b0c2a
                    estado: CANCELADA
                    nota: Quiero repasar normalización antes del certamen.
                    modalidad: EN_LINEA
                    lugar_o_enlace: 'https://meet.google.com/abc-defg-hij'
                    monto: 5000
                    estado_pago: null
                    creada_en: '2026-11-08T22:15:04Z'
                    confirmada_en: '2026-11-08T22:40:31Z'
                    cerrada_en: '2026-11-09T14:05:12Z'
                    bloque:
                      id: 60000000-0000-4000-8000-000000000013
                      inicio_en: '2026-11-11T21:00:00Z'
                      fin_en: '2026-11-11T22:00:00Z'
                    asignatura:
                      asignatura_id: 40000000-0000-4000-8000-000000000006
                      sigla: BDD1101
                      nombre: Base de Datos
                    tutor:
                      usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                    solicitante:
                      usuario_id: 10000000-0000-4000-8000-000000000004
                      nombre: Camila
                      apellido: Rojas
                    rol: tutor
        '400':
          description: |
            El bloque de la reserva ya empezó, aunque todavía no termine
            (`bloque_en_el_pasado`, el mismo código de la solicitud y de la
            confirmación): ya no se puede retirar ni cancelar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_en_el_pasado:
                  $ref: '#/components/examples/TutoriaQueYaEmpezoAlCancelar'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '404':
          description: |
            La reserva no existe o el usuario del token no es su solicitante
            ni su tutor (`reserva_no_encontrada`). Los casos responden igual,
            para no revelar que existe. Si `reserva_id` no es un uuid en
            minúsculas, la ruta no existe y responde Django con su página 404
            en HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: reserva_no_encontrada
                mensaje: No encontramos esa tutoría.
                detalles: null
        '409':
          description: |
            La reserva no se puede retirar ni cancelar
            (`reserva_no_cancelable`): ya está RECHAZADA, EXPIRADA, CANCELADA,
            REALIZADA o EVALUADA, y el mensaje dice en qué estado está; o está
            SOLICITADA y quien la pide es el tutor, que no la retira sino que
            la rechaza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rechazada:
                  $ref: '#/components/examples/NoCancelableRechazada'
                expirada:
                  $ref: '#/components/examples/NoCancelableExpirada'
                cancelada:
                  $ref: '#/components/examples/NoCancelableCancelada'
                realizada:
                  $ref: '#/components/examples/NoCancelableRealizada'
                evaluada:
                  $ref: '#/components/examples/NoCancelableEvaluada'
                solo_la_retira_quien_la_pidio:
                  $ref: '#/components/examples/SoloLaRetiraQuienLaPidio'
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /reservas/{reserva_id}/evaluacion:
    post:
      tags: [Evaluaciones]
      operationId: evaluarTutoria
      summary: Evaluar una tutoría realizada
      description: |
        Registra la evaluación de una tutoría realizada y recalcula la
        reputación del tutor en la misma transacción (HU-25 y RN-06).

        - Primero valida el cuerpo, sin tocar la base: `calificacion` es un
          entero de 1 a 5 (400 `calificacion_invalida`, en JSON `true` y
          `false` no cuentan como enteros) y `comentario`, si viene, es un
          texto de hasta 500 caracteres después de quitar los espacios de los
          lados y sin caracteres nulos ni sustitutos UTF-16 (400
          `comentario_invalido`). Vacío o en blanco se guarda como `null`.
        - En una transacción bloquea la reserva (`SELECT … FOR UPDATE`) y
          revisa, en este orden:
          1. Si la reserva no existe o el usuario del token no es ni el
             solicitante ni el tutor: 404 `reserva_no_encontrada` (los dos
             casos responden igual, para no revelar que existe).
          2. Si el usuario del token es el tutor del bloque: 403
             `solo_el_solicitante`.
          3. Si la reserva ya está en `EVALUADA` o ya tiene fila en
             `evaluacion`: 409 `reserva_ya_evaluada`.
          4. Si la reserva no está en `REALIZADA`: 409 `reserva_no_realizada`.
          5. Si `fin_en` del bloque todavía no pasó: 409
             `tutoria_no_terminada`.
        - Crea la evaluación, pasa la reserva a `EVALUADA` con `cerrada_en` en
          el instante actual y recalcula `reputacion_promedio` (redondeado a 2
          decimales con `ROUND_HALF_UP`) y `reputacion_total` en `usuario_ref`
          contando solo las evaluaciones con `retirada_en IS NULL`, sin tocar
          `actualizado_en`.
      security:
        - tokenAcceso: []
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaEvaluacion'
            examples:
              con_comentario:
                summary: Calificación de 5 con comentario
                value:
                  calificacion: 5
                  comentario: Explicó claro y con ejercicios parecidos a los del certamen.
              sin_comentario:
                summary: Calificación sin comentario
                value:
                  calificacion: 4
      responses:
        '201':
          description: Evaluación registrada, reserva en EVALUADA y reputación del tutor al día.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionRegistrada'
              example:
                id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                reserva_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                calificacion: 5
                comentario: Explicó claro y con ejercicios parecidos a los del certamen.
                creada_en: '2026-11-05T19:30:00Z'
        '400':
          description: |
            La calificación o el comentario no sirven (`calificacion_invalida`
            o `comentario_invalido`), o el cuerpo no es JSON válido
            (`parse_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                calificacion_invalida:
                  summary: Calificación fuera de 1 a 5 o no entera
                  value:
                    codigo: calificacion_invalida
                    mensaje: La nota tiene que ser un número entero de 1 a 5.
                    detalles: null
                comentario_largo:
                  summary: Comentario de más de 500 caracteres
                  value:
                    codigo: comentario_invalido
                    mensaje: El comentario puede tener hasta 500 caracteres.
                    detalles: null
                comentario_caracteres:
                  summary: Comentario con carácter nulo o sustituto UTF-16
                  value:
                    codigo: comentario_invalido
                    mensaje: El comentario tiene caracteres que no se pueden guardar.
                    detalles: null
                comentario_no_texto:
                  summary: Comentario que no es texto
                  value:
                    codigo: comentario_invalido
                    mensaje: El comentario tiene que ser un texto.
                    detalles: null
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          description: El usuario del token es el tutor de esa reserva, no quien la solicitó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: solo_el_solicitante
                mensaje: Solo quien pidió la tutoría puede evaluarla.
                detalles: null
        '404':
          description: |
            La reserva no existe o es de otras personas (`reserva_no_encontrada`).
            Si `reserva_id` no es un uuid en minúsculas, la ruta no existe y
            responde Django con su página 404 en HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: reserva_no_encontrada
                mensaje: No encontramos esa tutoría.
                detalles: null
        '409':
          description: |
            La reserva no se puede evaluar: ya fue evaluada
            (`reserva_ya_evaluada`), no está en estado REALIZADA
            (`reserva_no_realizada`) o su bloque todavía no termina
            (`tutoria_no_terminada`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reserva_ya_evaluada:
                  summary: Ya tenía evaluación
                  value:
                    codigo: reserva_ya_evaluada
                    mensaje: Ya evaluaste esta tutoría.
                    detalles: null
                reserva_no_realizada:
                  summary: La reserva está SOLICITADA, CONFIRMADA, RECHAZADA, EXPIRADA o CANCELADA
                  value:
                    codigo: reserva_no_realizada
                    mensaje: Solo se puede evaluar una tutoría realizada.
                    detalles: null
                tutoria_no_terminada:
                  summary: El bloque todavía no termina
                  value:
                    codigo: tutoria_no_terminada
                    mensaje: Podrás evaluarla cuando termine la tutoría.
                    detalles: null
        '503':
          $ref: '#/components/responses/ClavesNoConfiguradas'

  /estado:
    get:
      tags: [Estado]
      operationId: estadoTutorias
      summary: Estado del servicio y de su base
      description: |
        Dice si el servicio está arriba y puede leer su base, que prueba con
        un `SELECT 1` (HU-01). Lo consultan la integración continua (trabajo
        «levantar», que espera un 200) y la verificación de salud del
        contenedor en `docker-compose.yml`. Es pública: no pide token.

        Si la base no responde, no es un error de la API: responde 503 con
        el mismo esquema, con `estado` en `degradado`.
      security:
        - tokenAcceso: []
        - {}
      responses:
        '200':
          description: El servicio y su base responden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: tutoring
                estado: ok
                base_de_datos: ok
                version: 0.1.0
        '503':
          description: El servicio arrancó, pero no puede leer su base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
              example:
                servicio: tutoring
                estado: degradado
                base_de_datos: sin conexion
                version: 0.1.0
        '401':
          $ref: '#/components/responses/TokenNoValido'

components:

  securitySchemes:
    tokenAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cabecera `Authorization: Bearer <token_acceso>`. Es el token de acceso que firma Identidad, un JWT RS256 de 30 minutos (ver su contrato). Tutorías verifica la firma con la clave pública.'

  headers:
    DesafioBearer:
      description: Siempre `Bearer realm="tutoring"`.
      schema:
        type: string
      example: 'Bearer realm="tutoring"'

  parameters:
    BloqueId:
      name: bloque_id
      in: path
      required: true
      description: |
        Identificador del bloque, el `id` que entregan `GET` y
        `POST /disponibilidad`: un uuid en minúsculas y con guiones. Con otra
        forma la ruta no existe (ver la respuesta 404).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 4b7e2c1a-9d3f-4e6b-8a5c-1f2e3d4c5b6a
    PerfilId:
      name: perfil_id
      in: path
      required: true
      description: |
        Identificador de la asignatura declarada, el `id` que entregan `GET`
        y `POST /perfiles`: un uuid en minúsculas y con guiones. Con otra
        forma la ruta no existe (ver la respuesta 404).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 7d1c2b3a-4e5f-4a6b-9c8d-0e1f2a3b4c5d

    ReservaId:
      name: reserva_id
      in: path
      required: true
      description: |
        Identificador de la reserva: un uuid en minúsculas y con guiones. Con
        otra forma la ruta no existe (ver la respuesta 404).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f

  responses:
    TokenNoValido:
      description: |
        La petición trae un token en `Authorization: Bearer …` que no sirve.
        La ruta no pide token, pero si viene, Tutorías lo revisa antes de
        llegar a ella (HU-17). Los códigos posibles son:
        - `token_invalido`: el token está mal formado, su firma o su emisor
          no calzan, le falta una reclamación obligatoria o su `sub` no es un
          uuid;
        - `token_vencido`: el token venció (dura 30 minutos);
        - `authentication_failed`: la cabecera trae `Bearer` sin el token, o
          algo más después del token.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/DesafioBearer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalido:
              $ref: '#/components/examples/TokenInvalido'
            token_vencido:
              $ref: '#/components/examples/TokenVencido'
            cabecera_mal_formada:
              $ref: '#/components/examples/CabeceraMalFormada'
    SinTokenValido:
      description: |
        Sin un token válido (HU-17). Los códigos posibles son:
        - `not_authenticated`: no viene la cabecera
          `Authorization: Bearer …` (el mensaje es el estándar de Django REST
          Framework);
        - `token_invalido`, `token_vencido` y `authentication_failed`, como en
          `TokenNoValido`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/DesafioBearer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalido:
              $ref: '#/components/examples/TokenInvalido'
            token_vencido:
              $ref: '#/components/examples/TokenVencido'
            cabecera_mal_formada:
              $ref: '#/components/examples/CabeceraMalFormada'
    ClavesNoConfiguradas:
      description: |
        Tutorías no encuentra la clave pública con que verifica el token
        (`keys/jwt_public.pem`, que docker-compose.yml monta en `/app/keys`).
        Pasa en un clon nuevo si no se generaron las claves.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: claves_no_configuradas
            mensaje: 'No existe el archivo /app/keys/jwt_public.pem. Tutorías verifica los tokens con la clave pública de Identidad, keys/jwt_public.pem, que docker-compose.yml monta en /app/keys. Si faltan las claves, se generan en Identidad con: python manage.py generar_claves_jwt (ver el RUNBOOK, nivel 3).'
            detalles: null
    FechasInvalidas:
      description: |
        Las fechas del bloque no sirven. Los códigos posibles son:
        - `fecha_invalida`: `inicio_en` o `fin_en` no es una fecha ISO 8601,
          o falta al publicar;
        - `zona_horaria_requerida`: la fecha no trae la zona;
        - `fin_antes_de_inicio`: el término no es posterior al inicio;
        - `bloque_en_el_pasado`: el inicio ya pasó (al editar, también si el
          bloque ya empezó).

        Con `fin_en`, los dos primeros dicen «término» en vez de «inicio».
        Si el cuerpo no es JSON válido, responde `parse_error`, con el mensaje
        del framework.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            fecha_invalida:
              $ref: '#/components/examples/FechaInvalida'
            zona_horaria_requerida:
              $ref: '#/components/examples/ZonaHorariaRequerida'
            fin_antes_de_inicio:
              $ref: '#/components/examples/FinAntesDeInicio'
            bloque_en_el_pasado:
              $ref: '#/components/examples/BloqueEnElPasado'
    NoEsTutor:
      description: |
        El usuario del token no es tutor: su cuenta no está activa en
        Tutorías o no tiene ninguna asignatura activa. El mensaje pide
        declarar primero una asignatura.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            no_es_tutor:
              $ref: '#/components/examples/NoEsTutor'
    BloqueNoEncontrado:
      description: |
        El usuario del token no tiene un bloque con ese identificador: no
        existe, es de otro usuario o ya está ELIMINADO. Los tres casos
        responden lo mismo, para no revelar que el bloque existe.

        Si `bloque_id` no es un uuid en minúsculas, la ruta no existe y
        responde Django con su página 404, en HTML y sin el formato de error
        de la API, como en `GET /tutores/{usuario_id}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: not_found
            mensaje: No tienes un bloque con ese identificador.
            detalles: null
        text/html:
          schema:
            type: string
          examples:
            ruta_inexistente:
              summary: DELETE /disponibilidad/abc con DJANGO_DEBUG=1 (recortada)
              value: '<!DOCTYPE html><html lang="en"><head>...<title>Page not found at /api/tutoring/v1/disponibilidad/abc</title>...</html>'
    AsignaturaNoDeclarable:
      description: |
        La asignatura no se puede declarar. Los códigos posibles, en el orden
        en que se revisan, son:
        - `asignatura_invalida`: falta `asignatura_id` o no es un uuid;
        - `tarifa_invalida`: falta `tarifa`, o no es un entero de 0 a
          99.999.999;
        - `descripcion_invalida`: no es un texto, tiene más de 500
          caracteres o trae caracteres que no se pueden guardar, como el nulo;
        - `perfil_incompleto`: el usuario no tiene carrera o nivel en su
          perfil de Identidad;
        - `carrera_no_valida`: Catálogo no tiene su carrera activa;
        - `asignatura_no_habilitada`: no está en la malla vigente de su
          carrera, en un semestre anterior al que cursa (RN-01).

        Si el cuerpo no es JSON válido, responde `parse_error`, con el mensaje
        del framework.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            asignatura_invalida:
              $ref: '#/components/examples/AsignaturaInvalida'
            tarifa_invalida:
              $ref: '#/components/examples/TarifaInvalida'
            descripcion_invalida:
              $ref: '#/components/examples/DescripcionInvalida'
            perfil_incompleto:
              $ref: '#/components/examples/PerfilIncompleto'
            carrera_no_valida:
              $ref: '#/components/examples/CarreraNoValida'
            asignatura_no_habilitada:
              $ref: '#/components/examples/AsignaturaNoHabilitada'
    CuentaInactiva:
      description: |
        Identidad no reconoce la cuenta del token: no existe o está
        desactivada. Si tenía copia en Tutorías, la copia queda desactivada y
        deja de salir en la búsqueda (RN-08).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: cuenta_inactiva
            mensaje: La cuenta no existe o está desactivada.
            detalles: null
    PerfilNoEncontrado:
      description: |
        El usuario del token no tiene una asignatura declarada con ese
        identificador: no existe o es de otro usuario. Los dos casos responden
        lo mismo, para no revelar que existe.

        Si `perfil_id` no es un uuid en minúsculas, la ruta no existe y
        responde Django con su página 404, en HTML, como en
        `PATCH /disponibilidad/{bloque_id}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: not_found
            mensaje: No tienes una asignatura declarada con ese identificador.
            detalles: null
    SinOtroServicio:
      description: |
        Tutorías no pudo consultar a Identidad o a Catálogo: no responde, se
        demora más de 3 segundos o responde con un error 5xx. El código es
        `servicio_no_disponible` y el mensaje dice qué servicio falló.

        También puede ser `claves_no_configuradas`, si falta la clave pública
        (ver `ClavesNoConfiguradas`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            identidad:
              summary: Identidad no responde
              value:
                codigo: servicio_no_disponible
                mensaje: No pudimos comunicarnos con el servicio de Identidad. Intenta de nuevo en unos minutos.
                detalles: null
            catalogo:
              summary: Catálogo no responde
              value:
                codigo: servicio_no_disponible
                mensaje: No pudimos comunicarnos con el servicio de Catálogo. Intenta de nuevo en unos minutos.
                detalles: null

