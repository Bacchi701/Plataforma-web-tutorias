    post:
      tags: [Reservas]
      operationId: solicitarTutoria
      summary: Solicitar una tutoría
      description: |
        El usuario del token solicita una tutoría sobre un bloque LIBRE y
        futuro de un tutor, en una de las asignaturas que el tutor ofrece, con
        una nota opcional (HU-21). La reserva queda SOLICITADA y el bloque
        sigue LIBRE para otras solicitudes, hasta que el tutor confirme una
        (RN-03).

        Se revisa en este orden:
        1. El cuerpo, sin llamar a nadie: `bloque_id` es un uuid (400
           `bloque_invalido`); `asignatura_id` es un uuid (400
           `asignatura_invalida`), y `nota`, si viene, es un texto de hasta
           500 caracteres sin contar los espacios de los lados, sin
           caracteres que no se pueden guardar, como el nulo (400
           `nota_invalida`).
        2. Los datos del solicitante, con una llamada a Identidad (`GET /yo`,
           con el mismo token), que crea o pone al día su copia,
           `usuario_ref` (AD-07, decisión T-166). Si Identidad no reconoce la
           cuenta: 403 `cuenta_inactiva`, y la copia queda desactivada. Si el
           token vence entre medio: 401 `token_vencido`. Si Identidad no
           responde: 503 `servicio_no_disponible`, sin reserva.
        3. En una transacción que bloquea el bloque (`SELECT … FOR UPDATE`):
           que exista y no esté ELIMINADO (404 `bloque_no_encontrado`); que no
           sea del solicitante (400 `bloque_propio`); que no haya empezado
           (400 `bloque_en_el_pasado`); que esté LIBRE (409
           `bloque_no_disponible`), y que el tutor tenga un perfil activo en
           esa asignatura y su cuenta activa en Tutorías (400
           `asignatura_no_ofrecida`).
        4. Crea la reserva SOLICITADA, con la asignatura, la nota y un
           `monto` igual a la tarifa del tutor en ese momento: una copia
           congelada, que no cambia si después cambia la tarifa (ajuste
           A-04). Sin estado de pago. Si el solicitante ya tiene una solicitud
           pendiente para ese bloque, la base la rechaza (restricción
           `ux_reserva_solicitud_unica`): 409 `solicitud_duplicada`. Si la
           anterior ya no está pendiente (por ejemplo, la rechazaron), puede
           solicitar otra vez.

        - Después de guardar, Tutorías pide a Identidad el aviso al tutor
          (HU-16). Si el aviso no sale, la solicitud queda igual.
        - Una nota vacía o solo con espacios se guarda en null. Otros campos
          del cuerpo se ignoran.
      security:
        - tokenAcceso: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitud'
            examples:
              con_nota:
                summary: Camila pide a Valentina una tutoría de Base de Datos, con una nota
                value:
                  bloque_id: 60000000-0000-4000-8000-000000000013
                  asignatura_id: 40000000-0000-4000-8000-000000000006
                  nota: Quiero repasar normalización antes del certamen.
              sin_nota:
                summary: Lo mismo, sin nota
                value:
                  bloque_id: 60000000-0000-4000-8000-000000000013
                  asignatura_id: 40000000-0000-4000-8000-000000000006
      responses:
        '201':
          description: Solicitud creada. La reserva queda SOLICITADA y el bloque sigue LIBRE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              examples:
                camila:
                  summary: La solicitud de Camila a Valentina, con nota
                  description: |
                    Datos de ejemplo de `data/seeds/demo`, cargados el
                    08-11-2026: los bloques libres futuros se calculan desde
                    el día de la carga. El bloque 013 de Valentina queda el
                    11-11-2026 de 18:00 a 19:00, hora de Chile.
                  value:
                    id: 2b6f1c3e-8a4d-4e7b-9c1f-5d3a7e9b0c2a
                    estado: SOLICITADA
                    nota: Quiero repasar normalización antes del certamen.
                    modalidad: null
                    lugar_o_enlace: null
                    monto: 5000
                    estado_pago: null
                    creada_en: '2026-11-08T22:15:04Z'
                    confirmada_en: null
                    cerrada_en: null
                    bloque:
                      id: 60000000-0000-4000-8000-000000000013
                      inicio_en: '2026-11-11T21:00:00Z'
                      fin_en: '2026-11-11T22:00:00Z'
                    asignatura:
                      asignatura_id: 40000000-0000-4000-8000-000000000006
                      sigla: BDD1101
                      nombre: Base de Datos
                    tutor:
                      usuario_id: 10000000-0000-4000-8000-000000000001
                      nombre: Valentina
                      apellido: Soto
                    solicitante:
                      usuario_id: 10000000-0000-4000-8000-000000000004
                      nombre: Camila
                      apellido: Rojas
                    rol: estudiante
        '400':
          description: |
            La solicitud no sirve. Los códigos posibles, en el orden en que se
            revisan, son:
            - `bloque_invalido`: falta `bloque_id` o no es un uuid;
            - `asignatura_invalida`: falta `asignatura_id` o no es un uuid;
            - `nota_invalida`: la nota no es un texto, tiene más de 500
              caracteres o trae caracteres que no se pueden guardar;
            - `bloque_propio`: el bloque es del mismo solicitante (RN-03);
            - `bloque_en_el_pasado`: el bloque ya empezó;
            - `asignatura_no_ofrecida`: el tutor no tiene un perfil activo en
              esa asignatura, o su cuenta está desactivada en Tutorías.

            Si el cuerpo no es JSON válido, responde `parse_error`, con el
            mensaje del framework.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_invalido:
                  $ref: '#/components/examples/BloqueInvalido'
                asignatura_invalida:
                  $ref: '#/components/examples/AsignaturaDeLaSolicitudInvalida'
                nota_invalida:
                  $ref: '#/components/examples/NotaInvalida'
                bloque_propio:
                  $ref: '#/components/examples/BloquePropio'
                bloque_en_el_pasado:
                  $ref: '#/components/examples/HorarioQueYaEmpezo'
                asignatura_no_ofrecida:
                  $ref: '#/components/examples/AsignaturaNoOfrecida'
        '401':
          $ref: '#/components/responses/SinTokenValido'
        '403':
          $ref: '#/components/responses/CuentaInactiva'
        '404':
          description: El bloque no existe o está ELIMINADO (`bloque_no_encontrado`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: bloque_no_encontrado
                mensaje: 'No encontramos ese horario: puede que el tutor lo haya eliminado.'
                detalles: null
        '409':
          description: |
            El bloque ya tiene una tutoría confirmada (`bloque_no_disponible`),
            o el solicitante ya tiene una solicitud pendiente para ese bloque
            (`solicitud_duplicada`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bloque_no_disponible:
                  $ref: '#/components/examples/BloqueNoDisponible'
                solicitud_duplicada:
                  $ref: '#/components/examples/SolicitudDuplicada'
        '503':
          $ref: '#/components/responses/SinOtroServicio'

